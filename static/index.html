<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Server Manager — CATNETWORK</title>
<style>
/* ── Reset ─────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--sf:#1e293b;--sf2:#273348;--sf3:#2d3f57;
  --bd:#334155;--bd2:#4a5f7a;
  --tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;
  --ok:#22c55e;--warn:#f59e0b;--crit:#ef4444;--unk:#64748b;--pend:#3b82f6;
  --acc:#38bdf8;--acc2:#0ea5e9;
  --r:10px;
}
html{font-size:14px}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

/* ── Header ────────────────────────────── */
header{
  background:var(--sf);border-bottom:1px solid var(--bd);
  height:58px;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:50;
}
.logo{display:flex;align-items:center;gap:9px;font-size:1.05rem;font-weight:700;color:var(--acc);white-space:nowrap}
.hdr-stats{display:flex;align-items:center;gap:16px;flex:1;justify-content:center}
.stat{display:flex;align-items:center;gap:5px;font-size:0.8rem;color:var(--tx2)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-ok{background:var(--ok);box-shadow:0 0 5px var(--ok)}
.d-off{background:var(--tx3)}
.d-warn{background:var(--warn)}
.d-pend{background:var(--pend);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-right{display:flex;align-items:center;gap:8px}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:6px;border:1px solid var(--bd);
  background:var(--sf2);color:var(--tx);cursor:pointer;font-size:.82rem;
  transition:background .15s,border-color .15s;white-space:nowrap;
}
.btn:hover{background:var(--sf3);border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-settings{border-color:var(--bd2)}
.btn-settings:hover{border-color:var(--acc);color:var(--acc)}

/* ── Toolbar ───────────────────────────── */
.toolbar{
  background:var(--sf);border-bottom:1px solid var(--bd);
  padding:10px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.fl-label{font-size:.78rem;color:var(--tx2)}
.fl-btn{
  padding:3px 11px;border-radius:20px;border:1px solid var(--bd);
  background:transparent;color:var(--tx2);cursor:pointer;font-size:.78rem;transition:all .15s;
}
.fl-btn:hover,.fl-btn.act{border-color:var(--acc);color:var(--acc);background:rgba(56,189,248,.08)}
.search{
  margin-left:auto;background:var(--sf2);border:1px solid var(--bd);
  border-radius:6px;padding:5px 11px;color:var(--tx);font-size:.82rem;width:190px;outline:none;
}
.search:focus{border-color:var(--acc)}
.search::placeholder{color:var(--tx3)}

/* ── Grid ──────────────────────────────── */
main{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

/* ── Empty state ───────────────────────── */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:55vh;gap:14px;text-align:center;
}
.empty-icon{color:var(--bd2);opacity:.6}
.empty h2{font-size:1.1rem;color:var(--tx2)}
.empty p{font-size:.85rem;color:var(--tx3);max-width:320px;line-height:1.6}
.btn-primary{
  background:var(--acc);color:#0f172a;border-color:transparent;font-weight:600;
  padding:8px 20px;border-radius:7px;font-size:.9rem;
}
.btn-primary:hover{background:#7dd3fc;border-color:transparent}

/* ── Card ──────────────────────────────── */
.card{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 4px 18px rgba(56,189,248,.1)}

.card-head{padding:13px 15px 11px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-title{flex:1;min-width:0}
.card-name{font-size:.97rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-size:.75rem;color:var(--tx2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.hbadge{padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;letter-spacing:.03em}
.hb-ok  {background:rgba(34,197,94,.13); color:var(--ok);  border:1px solid rgba(34,197,94,.3)}
.hb-warn{background:rgba(245,158,11,.13);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.hb-crit{background:rgba(239,68,68,.13); color:var(--crit);border:1px solid rgba(239,68,68,.3)}
.hb-unk {background:rgba(100,116,139,.12);color:var(--unk);border:1px solid rgba(100,116,139,.3)}
.hb-pend{background:rgba(59,130,246,.12);color:var(--pend);border:1px solid rgba(59,130,246,.3)}

.card-div{height:1px;background:var(--bd);margin:0 15px}
.card-metrics{padding:11px 15px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric-label{font-size:.68rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.metric-val{font-size:.88rem;font-weight:600;margin-top:1px}
.mv-ok  {color:var(--ok)}
.mv-warn{color:var(--warn)}
.mv-crit{color:var(--crit)}
.mv-off {color:var(--tx3)}

.card-temps{padding:0 15px 12px;display:flex;flex-wrap:wrap;gap:5px}
.tchip{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 7px;border-radius:4px;font-size:.72rem;
  background:var(--sf2);border:1px solid var(--bd);
}
.tchip-ok  {border-color:rgba(34,197,94,.3)}
.tchip-warn{border-color:rgba(245,158,11,.4)}
.tchip-crit{border-color:rgba(239,68,68,.4)}
.tdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

.pbar-wrap{padding:0 15px 12px}
.pbar-row{display:flex;justify-content:space-between;font-size:.68rem;color:var(--tx2);margin-bottom:3px}
.pbar-track{height:3px;background:var(--sf2);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .5s}

.proto-tag{
  font-size:.62rem;padding:1px 6px;border-radius:3px;
  background:rgba(56,189,248,.1);color:var(--acc);border:1px solid rgba(56,189,248,.25);
  margin-left:6px;vertical-align:middle;
}
.card-err{padding:8px 15px 12px;font-size:.75rem;color:var(--crit);display:flex;align-items:center;gap:5px}

/* ── Loading spinner ───────────────────── */
.spin{width:30px;height:30px;border:2.5px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Settings Modal ────────────────────── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;overflow-y:auto;padding:20px}
.overlay.open{display:block}
.modal{
  background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  max-width:640px;margin:0 auto;overflow:hidden;animation:su .2s ease;
}
.detail-modal{max-width:900px}
@keyframes su{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hdr{
  padding:18px 22px;border-bottom:1px solid var(--bd);
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
}
.modal-title{font-size:1.05rem;font-weight:700}
.modal-sub{font-size:.78rem;color:var(--tx2);margin-top:3px}
.modal-close{background:none;border:none;color:var(--tx2);cursor:pointer;font-size:1.1rem;padding:2px;border-radius:4px;line-height:1;transition:color .15s}
.modal-close:hover{color:var(--tx)}
.modal-body{padding:22px}

/* Settings form */
.form-section{margin-bottom:22px}
.form-section:last-child{margin-bottom:0}
.form-sec-title{
  font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.form-sec-title::after{content:'';flex:1;height:1px;background:var(--bd)}
.form-row{display:flex;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px;flex:1}
label{font-size:.78rem;color:var(--tx2)}
.inp{
  background:var(--sf2);border:1px solid var(--bd);border-radius:6px;
  padding:7px 11px;color:var(--tx);font-size:.85rem;outline:none;width:100%;
}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:var(--tx3)}
textarea.inp{resize:vertical;min-height:110px;font-family:monospace;line-height:1.5;font-size:.82rem}
.inp-wrap{position:relative}
.inp-wrap .inp{padding-right:36px}
.eye-btn{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--tx2);cursor:pointer;padding:2px;
}
.eye-btn:hover{color:var(--tx)}

/* Protocol selector */
.proto-seg{display:flex;gap:0;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.proto-opt{
  flex:1;padding:7px 4px;text-align:center;font-size:.82rem;cursor:pointer;
  background:transparent;color:var(--tx2);border:none;transition:all .15s;
}
.proto-opt:not(:last-child){border-right:1px solid var(--bd)}
.proto-opt.sel{background:var(--acc);color:#0f172a;font-weight:600}
.proto-opt:not(.sel):hover{background:var(--sf3);color:var(--tx)}

/* IP count badge */
.ip-count{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.75rem;color:var(--acc);padding:3px 9px;
  background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);border-radius:20px;margin-top:6px;
}

/* Advanced collapse */
.adv-toggle{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:.78rem;color:var(--tx2);background:none;border:none;padding:6px 0;
  transition:color .15s;
}
.adv-toggle:hover{color:var(--tx)}
.adv-toggle svg{transition:transform .2s}
.adv-toggle.open svg{transform:rotate(90deg)}
.adv-body{display:none;padding-top:10px}
.adv-body.open{display:block}

/* Modal footer */
.modal-footer{
  padding:15px 22px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:10px;
}

/* Detail modal */
.sec-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--bd)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.ik{font-size:.68rem;color:var(--tx2);margin-bottom:1px}
.iv{font-size:.85rem;font-weight:500;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;padding:5px 9px;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2);border-bottom:1px solid var(--bd)}
td{padding:7px 9px;border-bottom:1px solid rgba(51,65,85,.5);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.s-ok{background:var(--ok)} .s-warn{background:var(--warn)} .s-crit{background:var(--crit)} .s-unk{background:var(--unk)}

@media(max-width:480px){.grid{grid-template-columns:1fr}.hdr-stats{display:none}main{padding:12px}}
/* ── Footer ────────────────────────────── */
.footer{
  text-align:center;padding:18px 0 22px;
  font-size:.72rem;color:var(--tx3);letter-spacing:.06em;
  border-top:1px solid rgba(51,65,85,.4);margin-top:8px;
}
.footer a{color:var(--tx3);text-decoration:none;transition:color .15s}
.footer a:hover{color:var(--tx2)}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="3" width="20" height="4" rx="1"/>
      <rect x="2" y="10" width="20" height="4" rx="1"/>
      <rect x="2" y="17" width="20" height="4" rx="1"/>
      <line x1="6" y1="5" x2="6.01" y2="5" stroke-width="3" stroke-linecap="round"/>
      <line x1="6" y1="12" x2="6.01" y2="12" stroke-width="3" stroke-linecap="round"/>
      <line x1="6" y1="19" x2="6.01" y2="19" stroke-width="3" stroke-linecap="round"/>
    </svg>
    Server Manager
  </div>

  <div class="hdr-stats">
    <div class="stat"><span class="dot d-ok"></span><span id="s-total">— 台</span></div>
    <div class="stat"><span class="dot d-ok"></span><span id="s-online">—</span> 在线</div>
    <div class="stat"><span class="dot d-off"></span><span id="s-offline">—</span> 离线</div>
    <div class="stat" id="s-collecting" style="display:none"><span class="dot d-pend"></span>采集中...</div>
    <div class="stat" id="s-refresh" style="color:var(--tx3)"></div>
  </div>

  <div class="hdr-right">
    <button class="btn" id="btn-refresh" onclick="triggerRefresh()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      刷新
    </button>
    <button class="btn btn-settings" onclick="openSettings()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      设置
    </button>
  </div>
</header>

<!-- Toolbar -->
<div class="toolbar">
  <span class="fl-label">筛选：</span>
  <button class="fl-btn act" onclick="setFilter('all',this)">全部</button>
  <button class="fl-btn" onclick="setFilter('ok',this)">正常</button>
  <button class="fl-btn" onclick="setFilter('warning',this)">警告</button>
  <button class="fl-btn" onclick="setFilter('critical',this)">严重</button>
  <button class="fl-btn" onclick="setFilter('offline',this)">离线</button>
  <input class="search" id="search" type="text" placeholder="搜索名称 / IP..." oninput="renderGrid()">
</div>

<!-- Main Content -->
<main id="main"></main>

<div class="footer">© 2026 <a href="https://www.catnetwork.co.jp" target="_blank" rel="noopener">CATNETWORK</a> &nbsp;·&nbsp; Server Manager</div>

<!-- ══ Settings Modal ══════════════════════════════════════════════ -->
<div class="overlay" id="ov-settings" onclick="closeOvOnBg(event,'ov-settings')">
<div class="modal">
  <div class="modal-hdr">
    <div>
      <div class="modal-title">BMC 配置</div>
      <div class="modal-sub">设置将自动保存并立即触发全量扫描</div>
    </div>
    <button class="modal-close" onclick="closeOverlay('ov-settings')">✕</button>
  </div>
  <div class="modal-body">

    <!-- IP Ranges -->
    <div class="form-section">
      <div class="form-sec-title">IP 地址范围</div>
      <div class="form-group">
        <label>BMC 地址（每行一条，支持多种格式）</label>
        <textarea class="inp" id="cfg-ip-ranges" placeholder="192.168.1.100&#10;192.168.1.100-200&#10;192.168.1.0/24&#10;10.0.1.50-10.0.1.80" oninput="updateIpCount()"></textarea>
        <div id="ip-count-badge" style="display:none" class="ip-count">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          <span id="ip-count-text">0 个地址</span>
        </div>
        <div style="font-size:.72rem;color:var(--tx3);margin-top:5px;line-height:1.7">
          格式示例：&nbsp; <code style="color:var(--acc)">192.168.1.50</code>&nbsp; 单IP
          <code style="color:var(--acc)">192.168.1.50-100</code>&nbsp; 末段范围
          <code style="color:var(--acc)">192.168.1.0/24</code>&nbsp; 子网段
        </div>
      </div>
    </div>

    <!-- Credentials -->
    <div class="form-section">
      <div class="form-sec-title">统一认证凭据</div>
      <div class="form-row">
        <div class="form-group">
          <label>用户名</label>
          <input class="inp" id="cfg-username" type="text" placeholder="admin" autocomplete="off">
        </div>
        <div class="form-group">
          <label>密码</label>
          <div class="inp-wrap">
            <input class="inp" id="cfg-password" type="password" placeholder="••••••••" autocomplete="new-password">
            <button class="eye-btn" onclick="togglePwd()" type="button" title="显示/隐藏密码">
              <svg id="eye-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Protocol -->
    <div class="form-section">
      <div class="form-sec-title">扫描协议</div>
      <div class="proto-seg" id="proto-seg">
        <button class="proto-opt sel" data-v="auto"    onclick="selProto(this)">自动检测</button>
        <button class="proto-opt"     data-v="redfish" onclick="selProto(this)">Redfish</button>
        <button class="proto-opt"     data-v="ipmi"    onclick="selProto(this)">IPMI</button>
      </div>
      <div id="proto-hint" style="font-size:.72rem;color:var(--tx3);margin-top:6px;line-height:1.6">
        自动检测：优先尝试 Redfish，失败后自动回退 IPMI（ipmitool）
      </div>
    </div>

    <!-- Advanced -->
    <div class="form-section">
      <button class="adv-toggle" id="adv-toggle" onclick="toggleAdv()" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        高级设置
      </button>
      <div class="adv-body" id="adv-body">
        <div class="form-row">
          <div class="form-group">
            <label>自动刷新间隔（秒）</label>
            <input class="inp" id="cfg-refresh" type="number" min="10" max="3600" value="60">
          </div>
          <div class="form-group">
            <label>连接超时（秒）</label>
            <input class="inp" id="cfg-timeout" type="number" min="3" max="60" value="15">
          </div>
          <div class="form-group">
            <label>最大并发数</label>
            <input class="inp" id="cfg-concurrent" type="number" min="1" max="50" value="10">
          </div>
        </div>
      </div>
    </div>

  </div>
  <div class="modal-footer">
    <button class="btn" onclick="closeOverlay('ov-settings')">取消</button>
    <button class="btn btn-primary" id="btn-save" onclick="saveSettings()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      保存并开始扫描
    </button>
  </div>
</div>
</div>

<!-- ══ Detail Modal ════════════════════════════════════════════════ -->
<div class="overlay" id="ov-detail" onclick="closeOvOnBg(event,'ov-detail')">
<div class="modal detail-modal">
  <div class="modal-hdr">
    <div>
      <div class="modal-title" id="det-title"></div>
      <div class="modal-sub"  id="det-sub"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="det-badge"></span>
      <button class="modal-close" onclick="closeOverlay('ov-detail')">✕</button>
    </div>
  </div>
  <div class="modal-body" id="det-body"></div>
</div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────
let servers = [], filter = 'all', cfgProto = 'auto', refreshInterval = 60;

// ── Helpers ───────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function hbadge(s){
  if(s.status==='offline') return ['hb-unk','离线'];
  if(s.status==='pending') return ['hb-pend','采集中'];
  const m={OK:['hb-ok','正常'],Warning:['hb-warn','警告'],Critical:['hb-crit','严重']};
  return m[s.health]||['hb-unk','未知'];
}
function sdot(h){
  const m={OK:'s-ok',Warning:'s-warn',Critical:'s-crit'};return m[h]||'s-unk';
}
function fmtTime(ts){
  if(!ts) return '—';
  return new Date(ts*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function fmtW(w){ return w!=null ? `${Math.round(w)} W` : '—'; }
function tempColor(h){ return h==='Critical'?'var(--crit)':h==='Warning'?'var(--warn)':'var(--ok)'; }

// ── Client-side IP range counter ──────────────────────────────────
function ipToInt(ip){ return ip.split('.').reduce((a,o)=>(a<<8)+parseInt(o),0)>>>0; }
function countIps(text){
  let n=0;
  for(const e of text.split(/[\n,;]+/)){
    const t=e.trim(); if(!t||t.startsWith('#')) continue;
    try{
      if(t.includes('/')){
        const bits=parseInt(t.split('/')[1]);
        n+=Math.pow(2,32-bits)-2;
      } else if(t.includes('-')){
        const [l,r]=t.split('-',2);
        const start=ipToInt(l.trim());
        const end=ipToInt(r.includes('.')?r.trim():l.trim().split('.').slice(0,3).join('.')+'.'+r.trim());
        n+=Math.max(0,end-start+1);
      } else { n+=1; }
    }catch(e){}
  }
  return n;
}

function updateIpCount(){
  const text=$('cfg-ip-ranges').value;
  const n=countIps(text);
  const badge=$('ip-count-badge');
  if(n>0){
    badge.style.display='inline-flex';
    $('ip-count-text').textContent=`共 ${n} 个地址`;
  } else {
    badge.style.display='none';
  }
}

// ── Settings UI ───────────────────────────────────────────────────
async function openSettings(){
  const s=await fetch('/api/settings').then(r=>r.json());
  $('cfg-ip-ranges').value=s.ip_ranges||'';
  $('cfg-username').value=s.username||'admin';
  $('cfg-password').value=s.password||'';
  $('cfg-refresh').value=s.refresh_interval||60;
  $('cfg-timeout').value=s.collection_timeout||15;
  $('cfg-concurrent').value=s.max_concurrent||10;
  cfgProto=s.protocol||'auto';
  document.querySelectorAll('.proto-opt').forEach(b=>{
    b.classList.toggle('sel',b.dataset.v===cfgProto);
  });
  updateProtoHint();
  updateIpCount();
  openOverlay('ov-settings');
}

function selProto(el){
  document.querySelectorAll('.proto-opt').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  cfgProto=el.dataset.v;
  updateProtoHint();
}

function updateProtoHint(){
  const hints={
    auto:'自动检测：优先尝试 Redfish，失败后自动回退 IPMI（需安装 ipmitool）',
    redfish:'仅使用 Redfish REST API（适合 Dell iDRAC 8+ / HPE iLO 5+ / Supermicro / 华为 iBMC）',
    ipmi:'仅使用 IPMI over LAN（需服务器已安装 ipmitool，适合不支持 Redfish 的旧设备）',
  };
  $('proto-hint').textContent=hints[cfgProto]||'';
}

function toggleAdv(){
  const tog=$('adv-toggle'), body=$('adv-body');
  tog.classList.toggle('open'); body.classList.toggle('open');
}
function togglePwd(){
  const inp=$('cfg-password');
  inp.type=inp.type==='password'?'text':'password';
}

async function saveSettings(){
  const btn=$('btn-save');
  btn.disabled=true;
  btn.innerHTML='<div class="spin" style="width:13px;height:13px;border-width:2px"></div> 保存中...';
  const payload={
    ip_ranges:$('cfg-ip-ranges').value,
    username:$('cfg-username').value,
    password:$('cfg-password').value,
    protocol:cfgProto,
    refresh_interval:parseInt($('cfg-refresh').value)||60,
    collection_timeout:parseInt($('cfg-timeout').value)||15,
    max_concurrent:parseInt($('cfg-concurrent').value)||10,
  };
  try{
    const res=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json();
    if(data.ok){
      closeOverlay('ov-settings');
      startPolling();
    }
  } catch(e){ alert('保存失败：'+e); }
  finally{
    btn.disabled=false;
    btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 保存并开始扫描';
  }
}

// ── Overlay helpers ───────────────────────────────────────────────
function openOverlay(id){ $(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeOverlay(id){ $(id).classList.remove('open'); document.body.style.overflow=''; }
function closeOvOnBg(e,id){ if(e.target===$(id)) closeOverlay(id); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') ['ov-settings','ov-detail'].forEach(closeOverlay); });

// ── Filter ────────────────────────────────────────────────────────
function setFilter(f,el){
  filter=f;
  document.querySelectorAll('.fl-btn').forEach(b=>b.classList.remove('act'));
  el.classList.add('act');
  renderGrid();
}
function matches(s){
  const q=$('search').value.toLowerCase();
  if(q&&!s.name.toLowerCase().includes(q)&&!s.bmc_ip.includes(q)) return false;
  if(filter==='all') return true;
  if(filter==='offline') return s.status!=='online';
  if(filter==='ok') return s.status==='online'&&s.health==='OK';
  if(filter==='warning') return s.status==='online'&&s.health==='Warning';
  if(filter==='critical') return s.status==='online'&&s.health==='Critical';
  return true;
}

// ── Card rendering ────────────────────────────────────────────────
function renderCard(s){
  const [hcls,hlbl]=hbadge(s);
  const proto=s.protocol_used?`<span class="proto-tag">${s.protocol_used}</span>`:'';

  // Fan summary
  const fans=s.fans||[];
  const fanBad=fans.filter(f=>f.health!=='OK'&&f.health!=='ok').length;
  const fanCls=fanBad>0?(fans.some(f=>f.health==='Critical')?'mv-crit':'mv-warn'):'mv-ok';
  const fanTxt=fans.length===0?'—':fanBad>0?`${fanBad} 异常`:`${fans.length} 正常`;

  // PSU summary
  const psus=s.power_supplies||[];
  const psuBad=psus.filter(p=>p.health!=='OK').length;
  const psuCls=psuBad>0?'mv-crit':'mv-ok';
  const psuTxt=psus.length===0?'—':psuBad>0?`${psuBad} 异常`:`${psus.length} 正常`;

  // Mem
  const ms=s.memory_summary||{};
  const memTxt=ms.total_gib?`${ms.total_gib} GiB`:'—';
  const memCls=ms.health==='OK'?'mv-ok':'mv-off';

  // Power bar
  const pct=s.power_consumed_watts?Math.min(100,s.power_consumed_watts/2000*100):0;
  const pbar=s.status==='online'&&s.power_consumed_watts!=null?`
  <div class="pbar-wrap">
    <div class="pbar-row"><span>功耗</span><span>${fmtW(s.power_consumed_watts)}</span></div>
    <div class="pbar-track"><div class="pbar-fill" style="width:${pct}%"></div></div>
  </div>`:'';

  // Top temps
  const topT=[...(s.temperatures||[])].sort((a,b)=>{
    const p=h=>h==='Critical'?2:h==='Warning'?1:0;
    return p(b.health)-p(a.health)||b.reading_celsius-a.reading_celsius;
  }).slice(0,4);
  const tempChips=topT.map(t=>{
    const c=t.health==='Critical'?'tchip-crit':t.health==='Warning'?'tchip-warn':'tchip-ok';
    const n=t.name.replace(/temperature/i,'').replace(/\s+/g,' ').trim()||t.name;
    return `<span class="tchip ${c}"><span class="tdot" style="background:${tempColor(t.health)}"></span>${esc(n)}: ${t.reading_celsius}°C</span>`;
  }).join('');

  const errHtml=s.error?`<div class="card-err">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>${esc(s.error)}</div>`:'';

  const pwrState=s.status==='online'?(s.power_state==='On'?'⚡ 开机':s.power_state==='Off'?'○ 关机':s.power_state||'—'):'—';
  const key=s.bmc_ip.replace(/\./g,'-');

  return `<div class="card" onclick="openDetail('${key}')">
  <div class="card-head">
    <div class="card-title">
      <div class="card-name">${esc(s.name)}${proto}</div>
      <div class="card-sub">${s.bmc_ip} · ${s.model||'型号未知'}</div>
    </div>
    <span class="hbadge ${hcls}">${hlbl}</span>
  </div>
  <div class="card-div"></div>
  <div class="card-metrics">
    <div><div class="metric-label">电源状态</div><div class="metric-val ${s.status==='online'?'mv-ok':'mv-off'}">${pwrState}</div></div>
    <div><div class="metric-label">内存</div><div class="metric-val ${memCls}">${memTxt}</div></div>
    <div><div class="metric-label">风扇</div><div class="metric-val ${fanCls}">${fanTxt}</div></div>
    <div><div class="metric-label">电源模块</div><div class="metric-val ${psuCls}">${psuTxt}</div></div>
  </div>
  ${topT.length?`<div class="card-temps">${tempChips}</div>`:''}
  ${pbar}
  ${errHtml}
  </div>`;
}

function renderGrid(){
  const vis=servers.filter(matches);
  const el=$('main');
  if(!vis.length){
    el.innerHTML='<div class="empty"><div style="color:var(--tx3)">没有符合条件的服务器</div></div>';
    return;
  }
  el.innerHTML=`<div class="grid">${vis.map(renderCard).join('')}</div>`;
}

// ── Detail modal ──────────────────────────────────────────────────
function openDetail(key){
  const ip=key.replace(/-/g,'.');
  const s=servers.find(x=>x.bmc_ip===ip);
  if(!s) return;
  const [hcls,hlbl]=hbadge(s);
  $('det-title').textContent=s.name;
  $('det-sub').textContent=`BMC: ${s.bmc_ip}  ·  序列号: ${s.serial||'—'}  ·  协议: ${s.protocol_used||'—'}  ·  更新: ${fmtTime(s.last_updated)}`;
  $('det-badge').innerHTML=`<span class="hbadge ${hcls}">${hlbl}</span>`;
  $('det-body').innerHTML=buildDetail(s);
  openOverlay('ov-detail');
}

function buildDetail(s){
  const sec=(title,body)=>`<div style="margin-bottom:20px"><div class="sec-title">${title}</div>${body}</div>`;
  const parts=[];

  // System info
  const ms=s.memory_summary||{};
  parts.push(sec('系统信息',`<div class="info-grid">
    <div><div class="ik">主机名</div><div class="iv">${s.hostname||'—'}</div></div>
    <div><div class="ik">制造商</div><div class="iv">${s.manufacturer||'—'}</div></div>
    <div><div class="ik">型号</div><div class="iv">${s.model||'—'}</div></div>
    <div><div class="ik">序列号</div><div class="iv">${s.serial||'—'}</div></div>
    <div><div class="ik">BIOS / 固件</div><div class="iv">${s.bios_version||'—'}</div></div>
    <div><div class="ik">电源状态</div><div class="iv">${s.power_state||'—'}</div></div>
    ${ms.total_gib?`<div><div class="ik">总内存</div><div class="iv">${ms.total_gib} GiB</div></div>`:''}
    <div><div class="ik">当前功耗</div><div class="iv">${fmtW(s.power_consumed_watts)}</div></div>
  </div>`));

  // Processors
  if((s.processors||[]).length){
    const rows=s.processors.map(p=>`<tr>
      <td>${esc(p.name)}</td><td>${esc(p.model||'—')}</td>
      <td>${p.cores??'—'}</td><td>${p.speed_ghz!=null?p.speed_ghz+' GHz':'—'}</td>
      <td><span class="sdot ${sdot(p.health)}"></span>${p.health||'—'}</td>
    </tr>`).join('');
    parts.push(sec('处理器',`<table><thead><tr><th>名称</th><th>型号</th><th>核心</th><th>频率</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`));
  }

  // Temperatures
  if((s.temperatures||[]).length){
    const rows=s.temperatures.map(t=>`<tr>
      <td>${esc(t.name)}</td>
      <td style="font-weight:600;color:${tempColor(t.health)}">${t.reading_celsius} °C</td>
      <td>${t.upper_caution!=null?t.upper_caution+' °C':'—'}</td>
      <td>${t.upper_critical!=null?t.upper_critical+' °C':'—'}</td>
      <td><span class="sdot ${sdot(t.health)}"></span>${t.health||'OK'}</td>
    </tr>`).join('');
    parts.push(sec('温度传感器',`<table><thead><tr><th>传感器</th><th>当前值</th><th>警告阈值</th><th>严重阈值</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`));
  }

  // Fans
  if((s.fans||[]).length){
    const rows=s.fans.map(f=>`<tr>
      <td>${esc(f.name)}</td>
      <td>${f.reading!=null?f.reading+' '+(f.reading_units||'RPM'):'—'}</td>
      <td><span class="sdot ${sdot(f.health)}"></span>${f.health||'—'}</td>
    </tr>`).join('');
    parts.push(sec('风扇',`<table><thead><tr><th>名称</th><th>转速</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`));
  }

  // PSU
  if((s.power_supplies||[]).length){
    const rows=s.power_supplies.map(p=>`<tr>
      <td>${esc(p.name)}</td><td>${esc(p.model||'—')}</td>
      <td>${p.line_input_voltage!=null?p.line_input_voltage+' V':'—'}</td>
      <td>${p.power_output_watts!=null?p.power_output_watts+' W':'—'}</td>
      <td><span class="sdot ${sdot(p.health)}"></span>${p.health||'—'}</td>
    </tr>`).join('');
    parts.push(sec('电源模块',`<table><thead><tr><th>名称</th><th>型号</th><th>输入电压</th><th>输出功率</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`));
  }

  // Storage
  if((s.storage||[]).length){
    const rows=s.storage.map(c=>`<tr>
      <td>${esc(c.name)}</td><td>${c.drives_count??'—'} 个</td>
      <td><span class="sdot ${sdot(c.health)}"></span>${c.health||'—'}</td>
    </tr>`).join('');
    parts.push(sec('存储控制器',`<table><thead><tr><th>控制器</th><th>驱动器数</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`));
  }

  // Alerts
  if((s.alerts||[]).length){
    parts.push(sec('告警',`<div style="color:var(--warn);font-size:.85rem">${s.alerts.map(esc).join('<br>')}</div>`));
  }

  // Error
  if(s.error){
    parts.push(sec('错误',`<div style="color:var(--crit);font-size:.82rem">${esc(s.error)}</div>`));
  }

  return parts.join('');
}

// ── Update UI ─────────────────────────────────────────────────────
function updateUI(data){
  servers=data.servers||[];
  $('s-total').textContent=`${data.total} 台`;
  $('s-online').textContent=data.online??'—';
  $('s-offline').textContent=data.offline??'—';
  $('s-collecting').style.display=data.collecting?'flex':'none';
  if(data.last_refresh) $('s-refresh').textContent='刷新: '+fmtTime(data.last_refresh);

  if(!data.configured&&!data.collecting){
    $('main').innerHTML=`<div class="empty">
      <svg class="empty-icon" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="2" y="3" width="20" height="4" rx="1"/>
        <rect x="2" y="10" width="20" height="4" rx="1"/>
        <rect x="2" y="17" width="20" height="4" rx="1"/>
        <line x1="6" y1="5" x2="6.01" y2="5" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <h2>尚未配置 BMC 地址</h2>
      <p>点击下方按钮，输入服务器 BMC 的 IP 地址范围和统一的登录凭据，即可开始监控。</p>
      <button class="btn btn-primary" onclick="openSettings()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        立即配置
      </button>
    </div>`;
    return;
  }

  if(data.collecting&&servers.every(s=>s.status==='pending')){
    $('main').innerHTML=`<div class="empty"><div class="spin"></div><div style="color:var(--tx2)">正在连接 BMC，采集硬件数据...</div></div>`;
    return;
  }

  renderGrid();
}

// ── Refresh ───────────────────────────────────────────────────────
async function triggerRefresh(){
  const btn=$('btn-refresh');
  btn.disabled=true;
  btn.innerHTML='<div class="spin" style="width:13px;height:13px;border-width:2px"></div> 刷新中';
  await fetch('/api/refresh',{method:'POST'}).catch(()=>{});
  startPolling();
  setTimeout(()=>{
    btn.disabled=false;
    btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> 刷新';
  },3000);
}

// ── Polling ───────────────────────────────────────────────────────
let _pollTimer=null;
function startPolling(){ if(_pollTimer) clearTimeout(_pollTimer); _pollTimer=setTimeout(poll,200); }
async function poll(){
  try{
    const data=await fetch('/api/servers').then(r=>r.json());
    updateUI(data);
    refreshInterval=data.refresh_interval||60;
    const next=data.collecting?1800:refreshInterval*1000;
    _pollTimer=setTimeout(poll,next);
  } catch(e){
    _pollTimer=setTimeout(poll,5000);
  }
}

// ── Init ──────────────────────────────────────────────────────────
$('main').innerHTML='<div class="empty"><div class="spin"></div><div style="color:var(--tx2)">连接中...</div></div>';
poll();
</script>
</body>
</html>

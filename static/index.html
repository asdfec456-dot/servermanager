<!DOCTYPE html>
<html lang="zh-CN" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Server Manager — CATNETWORK</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--sf:#1e293b;--sf2:#273348;--sf3:#2d3f57;
  --bd:#334155;--bd2:#4a5f7a;
  --tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;
  --ok:#22c55e;--warn:#f59e0b;--crit:#ef4444;--unk:#64748b;--pend:#3b82f6;
  --acc:#38bdf8;--shadow:rgba(0,0,0,.4);--overlay:rgba(0,0,0,.65);--r:10px;
}
:root.light{
  --bg:#f1f5f9;--sf:#ffffff;--sf2:#f8fafc;--sf3:#e2e8f0;
  --bd:#cbd5e1;--bd2:#94a3b8;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --ok:#15803d;--warn:#b45309;--crit:#b91c1c;--unk:#64748b;--pend:#1d4ed8;
  --acc:#0369a1;--shadow:rgba(0,0,0,.12);--overlay:rgba(0,0,0,.5);
}
html{font-size:14px}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;min-height:100vh;transition:background .2s,color .2s}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
/* Auth */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:36px 40px;width:100%;max-width:420px;box-shadow:0 8px 32px var(--shadow)}
.auth-logo{text-align:center;margin-bottom:26px}
.auth-logo h1{font-size:1.3rem;font-weight:700;color:var(--acc);margin-top:8px}
.auth-logo p{font-size:.8rem;color:var(--tx2);margin-top:3px}
.auth-step{display:none}.auth-step.active{display:block}
.step-title{font-size:1rem;font-weight:600;margin-bottom:18px}
.form-g{display:flex;flex-direction:column;gap:4px;margin-bottom:13px}
.form-g label{font-size:.73rem;color:var(--tx2)}
.inp{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:7px 11px;color:var(--tx);font-size:.83rem;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--acc)}.inp::placeholder{color:var(--tx3)}
select.inp{cursor:pointer}
.inp-wrap{position:relative}.inp-wrap .inp{padding-right:34px}
.eye-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--tx2);cursor:pointer}
.auth-err{color:var(--crit);font-size:.75rem;margin-bottom:9px;min-height:17px}
.btn-block{width:100%;padding:8px;border-radius:7px;border:none;cursor:pointer;font-size:.88rem;font-weight:600;transition:all .15s}
.btn-acc{background:var(--acc);color:#fff}.btn-acc:hover{opacity:.9}
:root.light .btn-acc{color:#0f172a}
.btn-acc:disabled{opacity:.5;cursor:not-allowed}
.auth-footer{text-align:center;font-size:.7rem;color:var(--tx3);margin-top:18px}
/* Header */
header{background:var(--sf);border-bottom:1px solid var(--bd);height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px var(--shadow)}
.logo{display:flex;align-items:center;gap:7px;font-size:.98rem;font-weight:700;color:var(--acc);white-space:nowrap}
.cluster-name{font-size:.72rem;color:var(--tx2);margin-left:3px;font-weight:400;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-stats{display:flex;align-items:center;gap:11px;flex:1;justify-content:center}
.stat{display:flex;align-items:center;gap:4px;font-size:.73rem;color:var(--tx2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-ok{background:var(--ok)}.d-off{background:var(--tx3)}
.d-pend{background:var(--pend);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:6px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);cursor:pointer;font-size:.73rem;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--sf3);border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-icon{padding:5px 6px}
.btn-danger{border-color:rgba(239,68,68,.4);color:var(--crit)}
.btn-danger:hover{background:rgba(239,68,68,.1);border-color:var(--crit)}
.user-badge{display:flex;align-items:center;gap:5px;padding:3px 8px;background:var(--sf2);border:1px solid var(--bd);border-radius:20px;font-size:.7rem;color:var(--tx2)}
.role-tag{font-size:.6rem;padding:1px 5px;border-radius:3px;font-weight:600}
.role-admin{background:rgba(56,189,248,.15);color:var(--acc);border:1px solid rgba(56,189,248,.3)}
.role-viewer{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.3)}
/* Lang switcher */
.lang-sw{display:flex;gap:1px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:2px}
.lang-btn{background:none;border:none;color:var(--tx2);cursor:pointer;padding:3px 6px;border-radius:4px;font-size:.7rem;font-weight:600;transition:all .15s}
.lang-btn:hover{color:var(--tx)}.lang-btn.act{background:var(--acc);color:#fff}
:root.light .lang-btn.act{color:#0f172a}
/* Toolbar */
.toolbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fl-btn,.fl-sc{padding:3px 9px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--tx2);cursor:pointer;font-size:.7rem;transition:all .15s}
.fl-btn:hover,.fl-btn.act{border-color:var(--acc);color:var(--acc);background:rgba(56,189,248,.08)}
.fl-sc:hover,.fl-sc.act{border-color:var(--warn);color:var(--warn);background:rgba(245,158,11,.07)}
.tsep{width:1px;height:16px;background:var(--bd);margin:0 2px;flex-shrink:0}
.search{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:4px 9px;color:var(--tx);font-size:.76rem;width:160px;outline:none}
.search:focus{border-color:var(--acc)}.search::placeholder{color:var(--tx3)}
/* View switcher */
.view-sw{display:flex;gap:1px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:2px}
.vbtn{background:none;border:none;color:var(--tx2);cursor:pointer;padding:4px 5px;border-radius:4px;display:flex;align-items:center;transition:all .15s}
.vbtn:hover{color:var(--tx);background:var(--sf3)}.vbtn.act{background:var(--acc);color:#fff}
:root.light .vbtn.act{color:#0f172a}
/* Main */
main{padding:16px;min-height:60vh}
.hbadge{padding:2px 7px;border-radius:20px;font-size:.63rem;font-weight:700;white-space:nowrap}
.hb-ok{background:rgba(34,197,94,.13);color:var(--ok);border:1px solid rgba(34,197,94,.3)}
.hb-warn{background:rgba(245,158,11,.13);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.hb-crit{background:rgba(239,68,68,.13);color:var(--crit);border:1px solid rgba(239,68,68,.3)}
.hb-unk{background:rgba(100,116,139,.12);color:var(--unk);border:1px solid rgba(100,116,139,.25)}
.hb-pend{background:rgba(59,130,246,.12);color:var(--pend);border:1px solid rgba(59,130,246,.3)}
.proto-tag{font-size:.58rem;padding:1px 4px;border-radius:3px;background:rgba(56,189,248,.1);color:var(--acc);border:1px solid rgba(56,189,248,.2);margin-left:4px;vertical-align:middle}
.sc-tag{font-size:.6rem;padding:1px 5px;border-radius:3px;background:rgba(245,158,11,.1);color:var(--warn);border:1px solid rgba(245,158,11,.25)}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:middle}
.s-ok{background:var(--ok)}.s-warn{background:var(--warn)}.s-crit{background:var(--crit)}.s-unk{background:var(--unk)}
/* Grid views */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.grid-wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 4px 16px var(--shadow)}
.card-head{padding:11px 13px 9px;display:flex;align-items:flex-start;justify-content:space-between;gap:7px}
.card-title{flex:1;min-width:0}
.card-name{font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-size:.68rem;color:var(--tx2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-div{height:1px;background:var(--bd);margin:0 13px}
.card-metrics{padding:9px 13px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ml{font-size:.62rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.mv{font-size:.82rem;font-weight:600;margin-top:1px}
.mv-ok{color:var(--ok)}.mv-warn{color:var(--warn)}.mv-crit{color:var(--crit)}.mv-off{color:var(--tx3)}
.card-temps{padding:0 13px 9px;display:flex;flex-wrap:wrap;gap:4px}
.tchip{display:inline-flex;align-items:center;gap:2px;padding:2px 5px;border-radius:3px;font-size:.62rem;background:var(--sf2);border:1px solid var(--bd)}
.tchip-ok{border-color:rgba(34,197,94,.3)}.tchip-warn{border-color:rgba(245,158,11,.4)}.tchip-crit{border-color:rgba(239,68,68,.4)}
.tdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.pbar-wrap{padding:0 13px 9px}
.pbar-row{display:flex;justify-content:space-between;font-size:.62rem;color:var(--tx2);margin-bottom:2px}
.pbar-track{height:3px;background:var(--sf2);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .5s}
.sc-tags{padding:0 13px 8px;display:flex;gap:3px;flex-wrap:wrap}
.card-err{padding:5px 13px 9px;font-size:.68rem;color:var(--crit);display:flex;align-items:center;gap:4px}
/* Detail list */
.detail-list{display:flex;flex-direction:column;gap:9px}
.dl-item{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:border-color .15s}
.dl-item:hover{border-color:var(--acc)}
.dl-head{padding:11px 15px;display:flex;align-items:center;gap:10px}
.dl-name{font-size:.92rem;font-weight:600;flex:1;min-width:0}
.dl-sub{font-size:.7rem;color:var(--tx2)}
.dl-body{padding:0 15px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px 14px;border-top:1px solid var(--bd);padding-top:10px}
.dl-field{display:flex;flex-direction:column;gap:2px}
.dl-lbl{font-size:.6rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.dl-val{font-size:.8rem;font-weight:500}
.dl-temps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
/* Simple list */
.simple-list{display:flex;flex-direction:column;gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.sl-item{background:var(--sf);padding:7px 13px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .1s;font-size:.78rem}
.sl-item:hover{background:var(--sf2)}
.sl-ip{font-family:monospace;font-size:.75rem;color:var(--tx2);min-width:115px;flex-shrink:0}
.sl-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sl-m{white-space:nowrap;font-size:.72rem;color:var(--tx2)}
.sl-sep{color:var(--bd2);flex-shrink:0}
/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf)}
.tbl-wrap table{width:100%;border-collapse:collapse;font-size:.76rem;min-width:860px}
.tbl-wrap th{background:var(--sf2);padding:7px 11px;text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);border-bottom:2px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:2}
.tbl-wrap th:hover{color:var(--tx)}.tbl-wrap th.sorted{color:var(--acc)}
.sort-arr{margin-left:3px;font-size:.65rem;opacity:.7}
.tbl-wrap td{padding:6px 11px;border-bottom:1px solid var(--bd);vertical-align:middle;white-space:nowrap}
.tbl-wrap tr:last-child td{border-bottom:none}
.tbl-wrap tr.trow{cursor:pointer;transition:background .1s}
.tbl-wrap tr.trow:hover td{background:var(--sf2)}
.td-ip{font-family:monospace;font-size:.72rem;color:var(--tx2)}
.td-r{text-align:right;font-variant-numeric:tabular-nums}
.td-hot{color:var(--crit);font-weight:600}.td-warm{color:var(--warn);font-weight:600}
/* SC group */
.sc-group{margin-bottom:18px}
.sc-group-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.sc-group-title::after{content:'';flex:1;height:1px;background:rgba(245,158,11,.2)}
/* Empty/Loading */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:12px;text-align:center}
.empty h2{font-size:.98rem;color:var(--tx2)}.empty p{font-size:.78rem;color:var(--tx3);max-width:280px;line-height:1.6}
.spin{width:26px;height:26px;border:2.5px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Overlay/Modal */
.overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:200;overflow-y:auto;padding:16px}
.overlay.open{display:block}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:12px;max-width:640px;margin:0 auto;overflow:hidden;animation:su .2s ease;box-shadow:0 16px 48px var(--shadow)}
.modal-wide{max-width:860px}
@keyframes su{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.modal-title{font-size:.96rem;font-weight:700}
.modal-sub{font-size:.7rem;color:var(--tx2);margin-top:2px}
.mclose{background:none;border:none;color:var(--tx2);cursor:pointer;font-size:1.05rem;padding:2px;border-radius:4px;line-height:1;transition:color .15s}
.mclose:hover{color:var(--tx)}
.modal-body{padding:18px}
.modal-footer{padding:11px 18px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:7px}
/* Form elements */
.form-row{display:flex;gap:9px}
.form-g2{display:flex;flex-direction:column;gap:3px;margin-bottom:11px;flex:1}
.form-g2 label{font-size:.68rem;color:var(--tx2)}
.sec-title{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--bd)}
.err-msg{color:var(--crit);font-size:.7rem;margin-bottom:7px;min-height:15px}
.proto-seg{display:flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.proto-opt{flex:1;padding:5px 4px;text-align:center;font-size:.73rem;cursor:pointer;background:transparent;color:var(--tx2);border:none;transition:all .15s}
.proto-opt:not(:last-child){border-right:1px solid var(--bd)}
.proto-opt.sel{background:var(--acc);color:#0f172a;font-weight:600}
.proto-opt:not(.sel):hover{background:var(--sf3);color:var(--tx)}
.ip-cnt{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;color:var(--acc);padding:2px 7px;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);border-radius:20px;margin-top:5px}
.adv-toggle{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:.7rem;color:var(--tx2);background:none;border:none;padding:5px 0;transition:color .15s}
.adv-toggle:hover{color:var(--tx)}.adv-toggle svg{transition:transform .2s}
.adv-toggle.open svg{transform:rotate(90deg)}
.adv-body{display:none;padding-top:8px}.adv-body.open{display:block}
/* User list */
.user-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:220px;overflow-y:auto}
.user-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;gap:8px}
.user-info{flex:1;min-width:0}
.user-name{font-size:.83rem;font-weight:600}
.user-meta{font-size:.68rem;color:var(--tx2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-sm{padding:3px 8px;border-radius:5px;border:1px solid var(--bd);background:var(--sf3);color:var(--tx2);cursor:pointer;font-size:.68rem;transition:all .15s}
.btn-sm:hover{border-color:var(--acc);color:var(--acc)}
.btn-sm-del{border-color:rgba(239,68,68,.3);color:var(--crit)}
.btn-sm-del:hover{background:rgba(239,68,68,.1);border-color:var(--crit)}
.access-list{display:flex;flex-direction:column;gap:4px;max-height:130px;overflow-y:auto;border:1px solid var(--bd);border-radius:5px;padding:6px 8px;background:var(--sf2)}
.access-item{display:flex;align-items:center;gap:6px;font-size:.72rem}
.access-item input{accent-color:var(--acc)}
/* Subcluster */
.sc-item{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 12px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;gap:8px;margin-bottom:6px}
.sc-info{flex:1;min-width:0}
.sc-name{font-size:.85rem;font-weight:600}
.sc-desc{font-size:.68rem;color:var(--tx2);margin-top:1px}
.sc-ips{font-size:.65rem;color:var(--tx3);margin-top:3px}
.ip-sel-wrap{max-height:160px;overflow-y:auto;border:1px solid var(--bd);border-radius:5px;background:var(--sf2)}
.ip-sel-item{display:flex;align-items:center;gap:7px;padding:5px 8px;cursor:pointer;transition:background .1s}
.ip-sel-item:hover{background:var(--sf3)}
.ip-sel-item input[type=checkbox]{accent-color:var(--acc);width:13px;height:13px}
.ip-sel-item label{font-size:.73rem;cursor:pointer;flex:1;min-width:0}
/* Detail tables */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.ik{font-size:.62rem;color:var(--tx2);margin-bottom:1px}
.iv{font-size:.78rem;font-weight:500;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:.75rem}
th{text-align:left;padding:5px 7px;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2);border-bottom:1px solid var(--bd)}
td{padding:6px 7px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--sf2)}
/* Footer */
.footer{text-align:center;padding:13px 0 17px;font-size:.65rem;color:var(--tx3);letter-spacing:.06em;border-top:1px solid var(--bd);margin-top:4px}
.footer a{color:var(--tx3);text-decoration:none}.footer a:hover{color:var(--tx2)}
@media(max-width:520px){.hdr-stats{display:none}main{padding:10px}.grid,.grid-wide{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- AUTH SCREEN -->
<div id="auth-screen" style="display:none">
<div class="auth-card">
  <div class="auth-logo">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8">
      <rect x="2" y="3" width="20" height="4" rx="1"/><rect x="2" y="10" width="20" height="4" rx="1"/><rect x="2" y="17" width="20" height="4" rx="1"/>
      <line x1="6" y1="5" x2="6.01" y2="5" stroke-width="3" stroke-linecap="round"/>
      <line x1="6" y1="12" x2="6.01" y2="12" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>Server Manager</h1>
    <p id="auth-cluster-sub" style="display:none"></p>
  </div>
  <!-- Setup -->
  <div class="auth-step" id="step-setup">
    <div class="step-title" id="lbl-setup-title">初始化设置</div>
    <p style="font-size:.76rem;color:var(--tx2);margin-bottom:16px;line-height:1.5" id="lbl-setup-sub">首次使用，请设定集群名称和管理员账户。</p>

let currentUser=null;

/* ── Helpers ───────────────────────────────────────────────── */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function authH(){return{'Content-Type':'application/json','Authorization':`Bearer ${token}`};}
async function api(m,p,b){
  const o={method:m,headers:authH()};
  if(b!==undefined)o.body=JSON.stringify(b);
  const r=await fetch(p,o);
  if(r.status===401){doLogout();return null;}
  return r;
}
function fmtT(ts){return ts?new Date(ts*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';}
function fmtW(w){return w!=null?`${Math.round(w)} W`:'—';}
function tCol(h){return h==='Critical'?'var(--crit)':h==='Warning'?'var(--warn)':'var(--ok)';}
function toggleEye(id){const i=$(id);i.type=i.type==='password'?'text':'password';}
function maxTemp(s){const ts=s.temperatures||[];return ts.length?Math.max(...ts.map(t=>t.reading_celsius)):null;}
function fanSum(s){const f=s.fans||[],b=f.filter(x=>x.health!=='OK').length;return f.length===0?'—':b>0?`${b}${t('c.anomaly')}`:`${f.length}${t('c.normal')}`;}
function psuSum(s){const p=s.power_supplies||[],b=p.filter(x=>x.health!=='OK').length;return p.length===0?'—':b>0?`${b}${t('c.anomaly')}`:`${p.length}${t('c.normal')}`;}
function fanCls(s){const f=s.fans||[];if(f.some(x=>x.health==='Critical'))return'mv-crit';if(f.some(x=>x.health==='Warning'))return'mv-warn';return'mv-ok';}
function sdot(h){return{OK:'s-ok',Warning:'s-warn',Critical:'s-crit'}[h]||'s-unk';}
function hbadge(s){
  if(s.status==='offline')return['hb-unk',t('h.offline')];
  if(s.status==='pending')return['hb-pend',t('h.collecting')];
  const m={OK:['hb-ok',t('h.ok')],Warning:['hb-warn',t('h.warning')],Critical:['hb-crit',t('h.critical')]};
  return m[s.health]||['hb-unk',t('h.unknown')];
}

/* ── Auth ──────────────────────────────────────────────────── */
async function checkAuth(){
  const st=await fetch('/api/auth/status').then(r=>r.json()).catch(()=>null);
  if(!st)return;
  if(!st.initialized){showAuth('setup');return;}
  $('auth-cluster-sub').textContent=st.cluster_name;
  $('auth-cluster-sub').style.display='block';
  if(token){const r=await api('GET','/api/auth/me');if(r&&r.ok){currentUser=await r.json();showApp();return;}}
  showAuth('login');
}
function showAuth(step){
  $('app').style.display='none';$('auth-screen').style.display='flex';
  document.querySelectorAll('.auth-step').forEach(s=>s.classList.remove('active'));
  $('step-'+step).classList.add('active');
  setTimeout(()=>$(step==='login'?'l-user':'s-cluster').focus(),80);
}
function showApp(){
  $('auth-screen').style.display='none';$('app').style.display='block';
  $('hdr-uname').textContent=currentUser.username;
  $('hdr-cluster').textContent=currentUser.cluster_name;
  $('hdr-role-tag').textContent=t(currentUser.role==='admin'?'role.admin':'role.viewer');
  $('hdr-role-tag').className='role-tag '+(currentUser.role==='admin'?'role-admin':'role-viewer');
  document.querySelectorAll('.admin-only').forEach(el=>el.style.display=currentUser.role==='admin'?'':'none');
  initViewBtn();applyI18n();startPolling();
}
async function doSetup(){
  const cl=$('s-cluster').value.trim(),un=$('s-user').value.trim(),pw=$('s-pass').value,pw2=$('s-pass2').value,err=$('setup-err');
  err.textContent='';
  if(!cl){err.textContent=t('setup.cluster')+' ?';return;}
  if(!un){err.textContent=t('u.err_name');return;}
  if(pw.length<6){err.textContent=t('u.err_short');return;}
  if(pw!==pw2){err.textContent='密码不一致';return;}
  const r=await fetch('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cluster_name:cl,username:un,password:pw})});
  const d=await r.json();
  if(!r.ok){err.textContent=d.detail||'失败';return;}
  token=d.token;localStorage.setItem('sm_token',token);
  currentUser={username:d.username,role:d.role,cluster_access:null,machine_access:null,cluster_name:d.cluster_name};
  showApp();
}
async function doLogin(){
  const un=$('l-user').value.trim(),pw=$('l-pass').value,err=$('login-err'),btn=$('login-btn');
  err.textContent='';
  if(!un||!pw){err.textContent=t('u.err_pass');return;}
  btn.disabled=true;btn.textContent=t('login.loading');
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:un,password:pw})});

}

/* ── Filter & Sort ─────────────────────────────────────────── */
function setFilter(f,el){filter=f;scFilter=null;document.querySelectorAll('.fl-btn,.fl-sc').forEach(b=>b.classList.remove('act'));el.classList.add('act');renderGrid();}
function setScFilter(id,el){scFilter=id;filter='all';document.querySelectorAll('.fl-btn,.fl-sc').forEach(b=>b.classList.remove('act'));el.classList.add('act');renderGrid();}
function renderScFilterBtns(){$('sc-filter-btns').innerHTML=subclusters.map(sc=>`<button class="fl-sc${scFilter===sc.id?' act':''}" onclick="setScFilter('${sc.id}',this)">${esc(sc.name)}</button>`).join('');}
function matchFilter(s){
  const q=$('search').value.toLowerCase();
  if(q&&!s.name.toLowerCase().includes(q)&&!s.bmc_ip.includes(q))return false;
  if(scFilter!==null)return(s.subcluster_ids||[]).includes(scFilter);
  if(filter==='all')return true;
  if(filter==='offline')return s.status!=='online';
  if(filter==='ok')return s.status==='online'&&s.health==='OK';
  if(filter==='warning')return s.status==='online'&&s.health==='Warning';
  if(filter==='critical')return s.status==='online'&&s.health==='Critical';
  return true;
}
function sortedServers(arr){
  const gv=(s,c)=>{switch(c){case'bmc_ip':return s.bmc_ip;case'name':return s.name;case'status':return s.status;case'health':return s.health;case'proto':return s.protocol_used||'';case'mfr':return s.manufacturer||'';case'model':return s.model||'';case'memory':return(s.memory_summary||{}).total_gib;case'cpu':return(s.processors||[])[0]?.model||'';case'cores':return(s.processors||[])[0]?.cores;case'power':return s.power_consumed_watts;case'temp':return maxTemp(s);default:return null;}};
  return[...arr].sort((a,b)=>{let av=gv(a,sortCol),bv=gv(b,sortCol);if(typeof av==='string'&&typeof bv==='string')return av.localeCompare(bv)*sortDir;av=av??-Infinity;bv=bv??-Infinity;return(av-bv)*sortDir;});
}
function clickSort(c){if(sortCol===c)sortDir*=-1;else{sortCol=c;sortDir=1;}renderGrid();}
function sArr(c){return sortCol!==c?'<span class="sort-arr">↕</span>':sortDir===1?'<span class="sort-arr">↑</span>':'<span class="sort-arr">↓</span>';}

  const chips=topT.map(tp=>{const c=tp.health==='Critical'?'tchip-crit':tp.health==='Warning'?'tchip-warn':'tchip-ok';const n=tp.name.replace(/temperature/i,'').replace(/\s+/g,' ').trim()||tp.name;return`<span class="tchip ${c}"><span class="tdot" style="background:${tCol(tp.health)}"></span>${esc(n)}: ${tp.reading_celsius}°C</span>`;}).join('');

/* ── Main renderGrid ───────────────────────────────────────── */
function renderGrid(){
  const vis=servers.filter(matchFilter),el=$('main');
  if(!vis.length){el.innerHTML=`<div class="empty"><div style="color:var(--tx3)">${t('e.no_match')}</div></div>`;return;}
  const isViewerGroup=currentUser?.role==='viewer'&&!scFilter&&filter==='all'&&(viewMode==='grid'||viewMode==='grid-wide');
  const sorted=viewMode==='table'?sortedServers(vis):vis;
  switch(viewMode){
    case'grid':case'grid-wide':{
      const cls=viewMode==='grid-wide'?'grid-wide':'grid';
      if(isViewerGroup){
        let h='';
        for(const sc of subclusters){const items=sorted.filter(s=>(s.subcluster_ids||[]).includes(sc.id));if(!items.length)continue;h+=`<div class="sc-group"><div class="sc-group-title">${esc(sc.name)}${sc.description?` <span style="font-size:.62rem;color:var(--tx3);font-weight:400">${esc(sc.description)}</span>`:''}</div><div class="${cls}">${items.map(s=>renderCardHtml(s,viewMode==='grid-wide')).join('')}</div></div>`;}
        const ug=sorted.filter(s=>!(s.subcluster_ids||[]).length);
        if(ug.length)h+=`<div class="sc-group"><div class="sc-group-title">${t('ungrouped')}</div><div class="${cls}">${ug.map(s=>renderCardHtml(s)).join('')}</div></div>`;
        el.innerHTML=h;
      } else el.innerHTML=`<div class="${cls}">${sorted.map(s=>renderCardHtml(s,viewMode==='grid-wide')).join('')}</div>`;
      break;}
    case'list-detail':el.innerHTML=`<div class="detail-list">${sorted.map(renderDetailListHtml).join('')}</div>`;break;
    case'list-simple':el.innerHTML=`<div class="simple-list">${sorted.map(renderSimpleListHtml).join('')}</div>`;break;
    case'table':{
      const thead=TCOLS.map(c=>`<th class="${sortCol===c.k?' sorted':''}"${c.s!==false?` onclick="clickSort('${c.k}')" style="cursor:pointer"`:''}>${t(c.l)}${c.s!==false?sArr(c.k):''}</th>`).join('');
      el.innerHTML=`<div class="tbl-wrap"><table><thead><tr>${thead}</tr></thead><tbody>${sorted.map(renderTableRow).join('')}</tbody></table></div>`;
      break;}
  }
}

/* ── Polling ───────────────────────────────────────────────── */
function startPolling(){if(_pollTimer)clearTimeout(_pollTimer);_pollTimer=setTimeout(poll,200);}
async function poll(){

  catch(e){_pollTimer=setTimeout(poll,5000);}
}

function selProto(el){document.querySelectorAll('.proto-opt').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');cfgProto=el.dataset.v;updateProtoHint();}
function updateProtoHint(){const h={auto:t('cfg.hint_auto'),redfish:t('cfg.hint_rf'),ipmi:t('cfg.hint_ipmi')};$('proto-hint').textContent=h[cfgProto]||'';}
function countIps(tx){let n=0;for(const e of tx.split(/[\n,;]+/)){const s=e.trim();if(!s||s.startsWith('#'))continue;try{if(s.includes('/')){const b=parseInt(s.split('/')[1]);n+=Math.pow(2,32-b)-2;}else if(s.includes('-')){const[l,r]=s.split('-',2);const ip=o=>o.split('.').reduce((a,x)=>(a<<8)+parseInt(x),0)>>>0;const ei=(r.includes('.')?r:l.split('.').slice(0,3).join('.')+'.'+r);n+=Math.max(0,ip(ei)-ip(l)+1);}else n+=1;}catch(e){}}return n;}
function updateIpCount(){const n=countIps($('cfg-ip').value);const b=$('ip-cnt-badge');if(n>0){b.style.display='inline-flex';$('ip-cnt-text').textContent=t('cfg.ip_count').replace('{n}',n);}else b.style.display='none';}
function toggleAdv(){$('adv-toggle').classList.toggle('open');$('adv-body').classList.toggle('open');}
async function saveSettings(){const b=$('btn-save-cfg');b.disabled=true;$('lbl-cfg-save').textContent=t('cfg.saving');try{await api('POST','/api/settings',{ip_ranges:$('cfg-ip').value,username:$('cfg-user').value,password:$('cfg-pw').value,protocol:cfgProto,refresh_interval:parseInt($('cfg-ri').value)||60,collection_timeout:parseInt($('cfg-to').value)||15,max_concurrent:parseInt($('cfg-cc').value)||10});closeOverlay('ov-cfg');startPolling();}finally{b.disabled=false;$('lbl-cfg-save').textContent=t('cfg.save');}}

  // Machines
  $('nu-mac-list').innerHTML=servers.length===0
    ?`<div style="color:var(--tx3);font-size:.7rem;padding:3px">${t('u.no_mach')}</div>`
    :servers.map(s=>`<label class="access-item"><input type="checkbox" class="nu-mac-cb" value="${s.bmc_ip}"${selMach.includes(s.bmc_ip)?' checked':''}> ${s.bmc_ip}${s.name!==s.bmc_ip?` <span style="color:var(--tx3)">${esc(s.name)}</span>`:''}</label>`).join('');
}
async function editUser(id){
  const r=await api('GET','/api/users');if(!r)return;
  const u=(await r.json()).find(x=>x.id===id);if(!u)return;
  _editUserId=id;
  $('user-form-title').textContent=t('u.form_edit');
  $('nu-name').value=u.username;$('nu-pass').value='';
  $('nu-pass-hint').textContent=t('u.pass_hint_edit');
  $('nu-role').value=u.role;
  $('btn-user-cancel').style.display='';
  $('lbl-u-submit').textContent=t('u.save');
  $('user-err').textContent='';
  onRoleChange();
  await refreshAccessLists(u.cluster_access||[],u.machine_access||[]);
}
async function submitUser(){
  const name=$('nu-name').value.trim(),pw=$('nu-pass').value,role=$('nu-role').value,err=$('user-err');
  err.textContent='';
  if(!name){err.textContent=t('u.err_name');return;}
  if(!_editUserId&&!pw){err.textContent=t('u.err_pass');return;}
  if(pw&&pw.length<6){err.textContent=t('u.err_short');return;}
  const cluster_access=role==='viewer'?[...document.querySelectorAll('.nu-sc-cb:checked')].map(cb=>cb.value):null;
  const machine_access=role==='viewer'?[...document.querySelectorAll('.nu-mac-cb:checked')].map(cb=>cb.value):null;
  const body={username:name,role,cluster_access,machine_access};
  if(pw)body.password=pw;
  const r=_editUserId?await api('PUT',`/api/users/${_editUserId}`,body):await api('POST','/api/users',body);
  if(!r)return;
  const d=await r.json();
  if(!r.ok){err.textContent=d.detail||'失败';return;}
  resetUserForm();await refreshUserList();await refreshAccessLists([],[]);
}
async function deleteUser(id,uname){
  if(!confirm(`${t('u.confirm_del')} "${uname}"?`))return;
  const r=await api('DELETE',`/api/users/${id}`);if(!r)return;
  if(!r.ok){const d=await r.json();alert(d.detail||'失败');return;}
  await refreshUserList();
}

/* ── Subcluster Modal (fix: cancel closes modal in create mode) */
async function openScModal(){
  _editScId=null;resetScForm();
  await renderScList();renderIpSelect([]);
  $('ov-sc').classList.add('open');document.body.style.overflow='hidden';
}
function resetScForm(){
  _editScId=null;
  $('sc-form-title').textContent=t('sc.new');
  $('sc-name').value='';$('sc-desc').value='';
  $('lbl-sc-save').textContent=t('sc.create');
  $('sc-err').textContent='';
  renderIpSelect([]);
}
function cancelScEdit(){
  if(_editScId){
    // In edit mode: go back to create mode
    resetScForm();
  } else {
    // In create mode: close the modal
    closeOverlay('ov-sc');
  }
}
async function renderScList(){
  const r=await api('GET','/api/subclusters');if(!r)return;
  const scs=await r.json();subclusters=scs;renderScFilterBtns();
  $('sc-list').innerHTML=scs.length===0
    ?`<div style="color:var(--tx3);font-size:.73rem">${t('sc.no_list')}</div>`
    :scs.map(sc=>`<div class="sc-item">
<div class="sc-info"><div class="sc-name">${esc(sc.name)}</div>${sc.description?`<div class="sc-desc">${esc(sc.description)}</div>`:''}<div class="sc-ips">${sc.bmc_ips&&sc.bmc_ips.length?sc.bmc_ips.length+t('sc.count_unit')+': '+sc.bmc_ips.slice(0,3).join(', ')+(sc.bmc_ips.length>3?'...':''):t('sc.no_mach')}</div></div>
<div style="display:flex;gap:5px;flex-shrink:0"><button class="btn-sm" onclick="editSc('${sc.id}')">${t('sc.edit_btn')}</button><button class="btn-sm btn-sm-del" onclick="deleteSc('${sc.id}','${esc(sc.name)}')">${t('sc.del')}</button></div>
</div>`).join('');
}
function renderIpSelect(sel){
  const w=$('sc-ip-sel');
  if(!servers.length){w.innerHTML=`<div style="padding:8px;color:var(--tx3);font-size:.7rem">${t('sc.scan_first')}</div>`;return;}
  w.innerHTML=servers.map(s=>{const id='ip-'+s.bmc_ip.replace(/\./g,'-');return`<div class="ip-sel-item"><input type="checkbox" id="${id}" value="${s.bmc_ip}"${sel.includes(s.bmc_ip)?' checked':''}><label for="${id}">${s.bmc_ip}${s.name!==s.bmc_ip?` <span style="color:var(--tx3)">${esc(s.name)}</span>`:''}</label><span style="font-size:.62rem;color:${s.status==='online'?'var(--ok)':'var(--crit)'}">${s.status==='online'?'●':'○'}</span></div>`;}).join('');
}
async function editSc(id){
  const sc=subclusters.find(s=>s.id===id);if(!sc)return;
  _editScId=id;
  $('sc-form-title').textContent=t('sc.edit');
  $('sc-name').value=sc.name;$('sc-desc').value=sc.description||'';
  $('lbl-sc-save').textContent=t('sc.save');$('sc-err').textContent='';
  renderIpSelect(sc.bmc_ips||[]);
}
async function saveSubcluster(){
  const name=$('sc-name').value.trim(),desc=$('sc-desc').value.trim(),err=$('sc-err');
  err.textContent='';
  if(!name){err.textContent=t('sc.err_name');return;}
  const ips=[...document.querySelectorAll('#sc-ip-sel input:checked')].map(cb=>cb.value);
  const r=_editScId?await api('PUT',`/api/subclusters/${_editScId}`,{name,description:desc,bmc_ips:ips}):await api('POST','/api/subclusters',{name,description:desc,bmc_ips:ips});
  if(!r)return;
  if(!r.ok){const d=await r.json();err.textContent=d.detail||'失败';return;}
  resetScForm();await renderScList();renderGrid();
}
async function deleteSc(id,name){
  if(!confirm(`${t('sc.confirm_del')} "${name}"?\n${t('sc.confirm_note')}`))return;
  const r=await api('DELETE',`/api/subclusters/${id}`);if(!r)return;
  await renderScList();renderGrid();
}

/* ── Detail Modal ──────────────────────────────────────────── */
function openDetail(key){
  const ip=key.replace(/-/g,'.');const s=servers.find(x=>x.bmc_ip===ip);if(!s)return;
  const[hcls,hlbl]=hbadge(s);
  $('det-title').textContent=s.name;
  $('det-sub').textContent=`BMC: ${s.bmc_ip}  ·  ${t('d.serial')}: ${s.serial||'—'}  ·  ${t('t.proto')}: ${s.protocol_used||'—'}`;
  $('det-badge').innerHTML=`<span class="hbadge ${hcls}">${hlbl}</span>`;
  $('det-body').innerHTML=buildDetail(s);
  $('ov-detail').classList.add('open');document.body.style.overflow='hidden';
}
function buildDetail(s){
  const sec=(title,body)=>`<div style="margin-bottom:16px"><div class="sec-title">${title}</div>${body}</div>`;
  const ms=s.memory_summary||{};const parts=[];
  parts.push(sec(t('d.sysinfo'),`<div class="info-grid">
<div><div class="ik">${t('d.hostname')}</div><div class="iv">${s.hostname||'—'}</div></div>
<div><div class="ik">${t('d.mfr')}</div><div class="iv">${s.manufacturer||'—'}</div></div>
<div><div class="ik">${t('d.model')}</div><div class="iv">${s.model||'—'}</div></div>
<div><div class="ik">${t('d.serial')}</div><div class="iv">${s.serial||'—'}</div></div>
<div><div class="ik">${t('d.bios')}</div><div class="iv">${s.bios_version||'—'}</div></div>
<div><div class="ik">${t('d.power')}</div><div class="iv">${s.power_state||'—'}</div></div>
${ms.total_gib?`<div><div class="ik">${t('d.mem')}</div><div class="iv">${ms.total_gib} GiB</div></div>`:''}
<div><div class="ik">${t('d.draw')}</div><div class="iv">${fmtW(s.power_consumed_watts)}</div></div>
</div>`));
  if((s.processors||[]).length){const rows=s.processors.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.model||'—')}</td><td>${p.cores??'—'}</td><td>${p.speed_ghz!=null?p.speed_ghz+' GHz':'—'}</td><td><span class="sdot ${sdot(p.health)}"></span>${p.health||'—'}</td></tr>`).join('');parts.push(sec(t('d.proc'),`<table><thead><tr><th>${t('d.name')}</th><th>${t('d.model')}</th><th>${t('d.cores')}</th><th>${t('d.freq')}</th><th>${t('t.health')}</th></tr></thead><tbody>${rows}</tbody></table>`));}
  if((s.temperatures||[]).length){const rows=s.temperatures.map(tp=>`<tr><td>${esc(tp.name)}</td><td style="font-weight:600;color:${tCol(tp.health)}">${tp.reading_celsius} °C</td><td>${tp.upper_caution!=null?tp.upper_caution+' °C':'—'}</td><td>${tp.upper_critical!=null?tp.upper_critical+' °C':'—'}</td><td><span class="sdot ${sdot(tp.health)}"></span>${tp.health||'OK'}</td></tr>`).join('');parts.push(sec(t('d.temp'),`<table><thead><tr><th>${t('d.sensor')}</th><th>${t('d.current')}</th><th>${t('d.warn')}</th><th>${t('d.crit')}</th><th>${t('t.health')}</th></tr></thead><tbody>${rows}</tbody></table>`));}
  if((s.fans||[]).length){const rows=s.fans.map(f=>`<tr><td>${esc(f.name)}</td><td>${f.reading!=null?f.reading+' '+(f.reading_units||'RPM'):'—'}</td><td><span class="sdot ${sdot(f.health)}"></span>${f.health||'—'}</td></tr>`).join('');parts.push(sec(t('d.fans'),`<table><thead><tr><th>${t('d.name')}</th><th>${t('d.speed')}</th><th>${t('t.health')}</th></tr></thead><tbody>${rows}</tbody></table>`));}
  if((s.power_supplies||[]).length){const rows=s.power_supplies.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.model||'—')}</td><td>${p.line_input_voltage!=null?p.line_input_voltage+' V':'—'}</td><td>${p.power_output_watts!=null?p.power_output_watts+' W':'—'}</td><td><span class="sdot ${sdot(p.health)}"></span>${p.health||'—'}</td></tr>`).join('');parts.push(sec(t('d.psus'),`<table><thead><tr><th>${t('d.name')}</th><th>${t('d.model')}</th><th>${t('d.input_v')}</th><th>${t('d.output_w')}</th><th>${t('t.health')}</th></tr></thead><tbody>${rows}</tbody></table>`));}
  if((s.storage||[]).length){const rows=s.storage.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.drives_count??'—'}</td><td><span class="sdot ${sdot(c.health)}"></span>${c.health||'—'}</td></tr>`).join('');parts.push(sec(t('d.storage'),`<table><thead><tr><th>${t('d.name')}</th><th>${t('d.drives')}</th><th>${t('t.health')}</th></tr></thead><tbody>${rows}</tbody></table>`));}
  if((s.alerts||[]).length)parts.push(sec(t('d.alerts'),`<div style="color:var(--warn);font-size:.8rem">${s.alerts.map(esc).join('<br>')}</div>`));
  if(s.error)parts.push(sec(t('d.error'),`<div style="color:var(--crit);font-size:.77rem">${esc(s.error)}</div>`));
  return parts.join('');
}

/* ── Overlays ──────────────────────────────────────────────── */
function openOverlay(id){
  if(id==='ov-cfg')openSettingsModal();
  else if(id==='ov-users')openUsersModal();
  else if(id==='ov-sc')openScModal();
  else{$(id).classList.add('open');document.body.style.overflow='hidden';}
}
function closeOverlay(id){$(id).classList.remove('open');document.body.style.overflow='';}
function closeOvBg(e,id){if(e.target===$(id))closeOverlay(id);}

/* ── Init ──────────────────────────────────────────────────── */
applyTheme(localStorage.getItem('sm_theme')||'dark');
applyI18n();
checkAuth();
</script>

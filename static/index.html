<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Server Manager — CATNETWORK</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--sf:#1e293b;--sf2:#273348;--sf3:#2d3f57;
  --bd:#334155;--bd2:#4a5f7a;
  --tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;
  --ok:#22c55e;--warn:#f59e0b;--crit:#ef4444;--unk:#64748b;--pend:#3b82f6;
  --acc:#38bdf8;--acc2:#0ea5e9;
  --shadow:rgba(0,0,0,.4);--overlay:rgba(0,0,0,.65);
  --r:10px;
}
:root.light{
  --bg:#f1f5f9;--sf:#ffffff;--sf2:#f8fafc;--sf3:#e2e8f0;
  --bd:#cbd5e1;--bd2:#94a3b8;
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --ok:#15803d;--warn:#b45309;--crit:#b91c1c;--unk:#64748b;--pend:#1d4ed8;
  --acc:#0369a1;--acc2:#0284c7;
  --shadow:rgba(0,0,0,.12);--overlay:rgba(0,0,0,.5);
}
html{font-size:14px}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;min-height:100vh;transition:background .2s,color .2s}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

/* ── Auth Screen ────────────────────────────────── */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--bg)}
.auth-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:36px 40px;width:100%;max-width:420px;box-shadow:0 8px 32px var(--shadow)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo h1{font-size:1.4rem;font-weight:700;color:var(--acc);margin-top:10px}
.auth-logo p{font-size:.82rem;color:var(--tx2);margin-top:4px}
.auth-step{display:none}
.auth-step.active{display:block}
.step-title{font-size:1rem;font-weight:600;margin-bottom:20px}
.step-sub{font-size:.78rem;color:var(--tx2);margin-bottom:20px;line-height:1.6}
.form-g{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.form-g label{font-size:.75rem;color:var(--tx2)}
.inp{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:8px 11px;color:var(--tx);font-size:.85rem;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:var(--tx3)}
.inp-wrap{position:relative}
.inp-wrap .inp{padding-right:36px}
.eye-btn{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--tx2);cursor:pointer}
.auth-err{color:var(--crit);font-size:.78rem;margin-bottom:10px;min-height:18px}
.btn-block{width:100%;padding:9px;border-radius:7px;border:none;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .15s}
.btn-acc{background:var(--acc);color:#fff}
:root.light .btn-acc{color:#0f172a}
.btn-acc:hover{background:var(--acc2)}
.btn-acc:disabled{opacity:.5;cursor:not-allowed}
.auth-footer{text-align:center;font-size:.72rem;color:var(--tx3);margin-top:20px}

/* ── Header ─────────────────────────────────────── */
header{background:var(--sf);border-bottom:1px solid var(--bd);height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px var(--shadow)}
.logo{display:flex;align-items:center;gap:8px;font-size:1rem;font-weight:700;color:var(--acc);white-space:nowrap;min-width:0}
.cluster-name{font-size:.75rem;color:var(--tx2);margin-left:4px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.hdr-stats{display:flex;align-items:center;gap:12px;flex:1;justify-content:center}
.stat{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--tx2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-ok{background:var(--ok)}
.d-off{background:var(--tx3)}
.d-pend{background:var(--pend);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);cursor:pointer;font-size:.75rem;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--sf3);border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{border-color:rgba(239,68,68,.4);color:var(--crit)}
.btn-danger:hover{background:rgba(239,68,68,.1);border-color:var(--crit)}
.btn-icon{padding:5px 7px}
.user-badge{display:flex;align-items:center;gap:5px;padding:4px 9px;background:var(--sf2);border:1px solid var(--bd);border-radius:20px;font-size:.72rem;color:var(--tx2)}
.role-tag{font-size:.6rem;padding:1px 6px;border-radius:3px;font-weight:600}
.role-admin{background:rgba(56,189,248,.15);color:var(--acc);border:1px solid rgba(56,189,248,.3)}
.role-viewer{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.3)}

/* ── Toolbar ─────────────────────────────────────── */
.toolbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fl-label{font-size:.72rem;color:var(--tx2)}
.fl-btn,.fl-sc{padding:3px 10px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--tx2);cursor:pointer;font-size:.72rem;transition:all .15s}
.fl-btn:hover,.fl-btn.act{border-color:var(--acc);color:var(--acc);background:rgba(56,189,248,.08)}
.fl-sc:hover,.fl-sc.act{border-color:var(--warn);color:var(--warn);background:rgba(245,158,11,.07)}
.toolbar-sep{width:1px;height:18px;background:var(--bd);margin:0 2px;flex-shrink:0}
.search{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;color:var(--tx);font-size:.78rem;width:170px;outline:none;transition:border-color .15s}
.search:focus{border-color:var(--acc)}
.search::placeholder{color:var(--tx3)}

/* ── View Mode Switcher ──────────────────────────── */
.view-switcher{display:flex;gap:2px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:2px}
.vbtn{background:none;border:none;color:var(--tx2);cursor:pointer;padding:4px 6px;border-radius:5px;display:flex;align-items:center;transition:all .15s;line-height:1}
.vbtn:hover{color:var(--tx);background:var(--sf3)}
.vbtn.act{background:var(--acc);color:#fff}
:root.light .vbtn.act{color:#0f172a}

/* ── Shared card/item styles ─────────────────────── */
main{padding:16px;min-height:60vh}
.hbadge{padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:700;white-space:nowrap;letter-spacing:.03em}
.hb-ok  {background:rgba(34,197,94,.13); color:var(--ok);  border:1px solid rgba(34,197,94,.3)}
.hb-warn{background:rgba(245,158,11,.13);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.hb-crit{background:rgba(239,68,68,.13); color:var(--crit);border:1px solid rgba(239,68,68,.3)}
.hb-unk {background:rgba(100,116,139,.12);color:var(--unk);border:1px solid rgba(100,116,139,.25)}
.hb-pend{background:rgba(59,130,246,.12);color:var(--pend);border:1px solid rgba(59,130,246,.3)}
.proto-tag{font-size:.6rem;padding:1px 5px;border-radius:3px;background:rgba(56,189,248,.1);color:var(--acc);border:1px solid rgba(56,189,248,.2);margin-left:5px;vertical-align:middle}
.sc-tag{font-size:.62rem;padding:1px 6px;border-radius:3px;background:rgba(245,158,11,.1);color:var(--warn);border:1px solid rgba(245,158,11,.25)}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.s-ok{background:var(--ok)}.s-warn{background:var(--warn)}.s-crit{background:var(--crit)}.s-unk{background:var(--unk)}

/* ══ VIEW: Grid (card) ══════════════════════════════ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.grid-wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:14px}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 4px 18px var(--shadow)}
.card-head{padding:11px 13px 9px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-title{flex:1;min-width:0}
.card-name{font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-size:.7rem;color:var(--tx2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-div{height:1px;background:var(--bd);margin:0 13px}
.card-metrics{padding:9px 13px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ml{font-size:.63rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.mv{font-size:.82rem;font-weight:600;margin-top:1px}
.mv-ok{color:var(--ok)}.mv-warn{color:var(--warn)}.mv-crit{color:var(--crit)}.mv-off{color:var(--tx3)}
.card-temps{padding:0 13px 10px;display:flex;flex-wrap:wrap;gap:4px}
.tchip{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:.65rem;background:var(--sf2);border:1px solid var(--bd)}
.tchip-ok{border-color:rgba(34,197,94,.3)}.tchip-warn{border-color:rgba(245,158,11,.4)}.tchip-crit{border-color:rgba(239,68,68,.4)}
.tdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.pbar-wrap{padding:0 13px 10px}
.pbar-row{display:flex;justify-content:space-between;font-size:.63rem;color:var(--tx2);margin-bottom:3px}
.pbar-track{height:3px;background:var(--sf2);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .5s}
.sc-tags{padding:0 13px 9px;display:flex;gap:4px;flex-wrap:wrap}
.card-err{padding:6px 13px 10px;font-size:.7rem;color:var(--crit);display:flex;align-items:center;gap:4px}

/* ══ VIEW: Detailed List ════════════════════════════ */
.detail-list{display:flex;flex-direction:column;gap:10px}
.dl-item{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:border-color .15s,box-shadow .15s;overflow:hidden}
.dl-item:hover{border-color:var(--acc);box-shadow:0 2px 12px var(--shadow)}
.dl-head{padding:12px 16px;display:flex;align-items:center;gap:12px}
.dl-name{font-size:.95rem;font-weight:600;flex:1;min-width:0}
.dl-sub{font-size:.72rem;color:var(--tx2)}
.dl-body{padding:0 16px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 16px;border-top:1px solid var(--bd);padding-top:12px}
.dl-field{display:flex;flex-direction:column;gap:2px}
.dl-label{font-size:.63rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.dl-value{font-size:.82rem;font-weight:500}
.dl-temps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.dl-alerts{color:var(--warn);font-size:.78rem}
.dl-err{color:var(--crit);font-size:.75rem}

/* ══ VIEW: Simple List ══════════════════════════════ */
.simple-list{display:flex;flex-direction:column;gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.sl-item{background:var(--sf);padding:8px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .1s;font-size:.8rem}
.sl-item:hover{background:var(--sf2)}
.sl-ip{font-family:monospace;font-size:.78rem;color:var(--tx2);min-width:120px;flex-shrink:0}
.sl-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sl-metric{white-space:nowrap;font-size:.75rem;color:var(--tx2)}
.sl-sep{color:var(--bd2);padding:0 2px;flex-shrink:0}

/* ══ VIEW: Table ════════════════════════════════════ */
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf)}
.tbl-wrap table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:900px}
.tbl-wrap th{background:var(--sf2);padding:8px 12px;text-align:left;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);border-bottom:2px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:2}
.tbl-wrap th:hover{color:var(--tx);background:var(--sf3)}
.tbl-wrap th.sorted{color:var(--acc)}
.sort-arrow{margin-left:4px;opacity:.7;font-size:.7rem}
.tbl-wrap td{padding:7px 12px;border-bottom:1px solid var(--bd);vertical-align:middle;white-space:nowrap}
.tbl-wrap tr:last-child td{border-bottom:none}
.tbl-wrap tr.tbl-row{cursor:pointer;transition:background .1s}
.tbl-wrap tr.tbl-row:hover td{background:var(--sf2)}
.tbl-wrap td.td-ip{font-family:monospace;font-size:.75rem;color:var(--tx2)}
.tbl-ip-cell{display:flex;align-items:center;gap:5px}
.tbl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.td-num{text-align:right;font-variant-numeric:tabular-nums}
.td-hot{color:var(--crit);font-weight:600}
.td-warm{color:var(--warn);font-weight:600}

/* ── Subcluster group headings ───────────────────── */
.sc-group{margin-bottom:20px}
.sc-group-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sc-group-title::after{content:'';flex:1;height:1px;background:rgba(245,158,11,.2)}

/* ── Empty / Loading ────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:13px;text-align:center}
.empty h2{font-size:1rem;color:var(--tx2)}
.empty p{font-size:.8rem;color:var(--tx3);max-width:300px;line-height:1.6}
.spin{width:28px;height:28px;border:2.5px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Overlays / Modals ──────────────────────────── */
.overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:200;overflow-y:auto;padding:18px}
.overlay.open{display:block}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:12px;max-width:640px;margin:0 auto;overflow:hidden;animation:su .2s ease;box-shadow:0 16px 48px var(--shadow)}
.modal-wide{max-width:860px}
@keyframes su{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-title{font-size:.98rem;font-weight:700}
.modal-sub{font-size:.72rem;color:var(--tx2);margin-top:3px}
.mclose{background:none;border:none;color:var(--tx2);cursor:pointer;font-size:1.1rem;padding:2px;border-radius:4px;line-height:1;transition:color .15s}
.mclose:hover{color:var(--tx)}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}

/* Modal form elements */
.form-row{display:flex;gap:10px}
.form-g2{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;flex:1}
.form-g2 label{font-size:.7rem;color:var(--tx2)}
.sec-title{font-size:.63rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--bd)}
.err-msg{color:var(--crit);font-size:.72rem;margin-bottom:8px;min-height:16px}

/* Settings-specific */
.proto-seg{display:flex;gap:0;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.proto-opt{flex:1;padding:6px 4px;text-align:center;font-size:.75rem;cursor:pointer;background:transparent;color:var(--tx2);border:none;transition:all .15s}
.proto-opt:not(:last-child){border-right:1px solid var(--bd)}
.proto-opt.sel{background:var(--acc);color:#0f172a;font-weight:600}
.proto-opt:not(.sel):hover{background:var(--sf3);color:var(--tx)}
.ip-count{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:var(--acc);padding:2px 8px;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);border-radius:20px;margin-top:5px}
.adv-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:.72rem;color:var(--tx2);background:none;border:none;padding:5px 0;transition:color .15s}
.adv-toggle:hover{color:var(--tx)}
.adv-toggle svg{transition:transform .2s}
.adv-toggle.open svg{transform:rotate(90deg)}
.adv-body{display:none;padding-top:8px}
.adv-body.open{display:block}

/* User management */
.user-list{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.user-item{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;gap:10px}
.user-info{flex:1;min-width:0}
.user-name{font-size:.85rem;font-weight:600}
.user-meta{font-size:.7rem;color:var(--tx2);margin-top:2px}
.btn-sm{padding:3px 8px;border-radius:5px;border:1px solid var(--bd);background:var(--sf3);color:var(--tx2);cursor:pointer;font-size:.7rem;transition:all .15s}
.btn-sm:hover{border-color:var(--acc);color:var(--acc)}
.btn-sm-del{border-color:rgba(239,68,68,.3);color:var(--crit)}
.btn-sm-del:hover{background:rgba(239,68,68,.1);border-color:var(--crit)}
.access-list{display:flex;flex-direction:column;gap:5px;max-height:140px;overflow-y:auto;border:1px solid var(--bd);border-radius:6px;padding:7px 10px;background:var(--sf2)}
.access-item{display:flex;align-items:center;gap:7px;font-size:.75rem}
.access-item input{accent-color:var(--acc)}

/* Subcluster management */
.sc-item{display:flex;align-items:flex-start;justify-content:space-between;padding:11px 13px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;gap:10px;margin-bottom:7px}
.sc-info{flex:1;min-width:0}
.sc-name{font-size:.88rem;font-weight:600}
.sc-desc{font-size:.7rem;color:var(--tx2);margin-top:2px}
.sc-ips{font-size:.68rem;color:var(--tx3);margin-top:3px}
.ip-select-wrap{max-height:170px;overflow-y:auto;border:1px solid var(--bd);border-radius:6px;background:var(--sf2)}
.ip-select-item{display:flex;align-items:center;gap:8px;padding:5px 9px;cursor:pointer;transition:background .1s}
.ip-select-item:hover{background:var(--sf3)}
.ip-select-item input[type=checkbox]{accent-color:var(--acc);width:13px;height:13px}
.ip-select-item label{font-size:.75rem;cursor:pointer;flex:1;min-width:0}

/* Detail tables */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}
.ik{font-size:.63rem;color:var(--tx2);margin-bottom:1px}
.iv{font-size:.8rem;font-weight:500;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:.76rem}
th{text-align:left;padding:5px 8px;font-size:.63rem;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2);border-bottom:1px solid var(--bd)}
td{padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--sf2)}

/* Footer */
.footer{text-align:center;padding:14px 0 18px;font-size:.67rem;color:var(--tx3);letter-spacing:.06em;border-top:1px solid var(--bd);margin-top:4px}
.footer a{color:var(--tx3);text-decoration:none}
.footer a:hover{color:var(--tx2)}

@media(max-width:540px){.hdr-stats{display:none}main{padding:10px}.grid,.grid-wide{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ══ Auth Screen ══════════════════════════════════ -->
<div id="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8">
        <rect x="2" y="3" width="20" height="4" rx="1"/><rect x="2" y="10" width="20" height="4" rx="1"/>
        <rect x="2" y="17" width="20" height="4" rx="1"/>

<script>
// ── State ──────────────────────────────────────────
let token = localStorage.getItem('sm_token') || '';
let currentUser = null;
let servers = [], subclusters = [], filter = 'all', scFilter = null;
let viewMode = localStorage.getItem('sm_view') || 'grid';
let cfgProto = 'auto', _pollTimer = null;
let _editScId = null;
let sortCol = 'bmc_ip', sortDir = 1;

// ── Theme ──────────────────────────────────────────
function applyTheme(theme) {
  if (theme === 'light') {
    document.documentElement.classList.add('light');
  } else {
    document.documentElement.classList.remove('light');
  }
  // Update theme button icon
  const icon = $('theme-icon');
  if (theme === 'light') {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}

function toggleTheme() {
  const isLight = document.documentElement.classList.contains('light');
  const next = isLight ? 'dark' : 'light';
  localStorage.setItem('sm_theme', next);
  applyTheme(next);
}

// ── View Mode ──────────────────────────────────────
function setView(el) {
  viewMode = el.dataset.mode;
  localStorage.setItem('sm_view', viewMode);
  document.querySelectorAll('.vbtn').forEach(b => b.classList.remove('act'));
  el.classList.add('act');
  renderGrid();
}

function initViewBtn() {
  document.querySelectorAll('.vbtn').forEach(b => {
    b.classList.toggle('act', b.dataset.mode === viewMode);
  });
}

// ── Helpers ────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function authHeaders() {
  return {'Content-Type':'application/json','Authorization':`Bearer ${token}`};
}
async function api(method, path, body) {
  const opts = {method, headers: authHeaders()};
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (res.status === 401) { doLogout(); return null; }
  return res;
}

function fmtTime(ts) { return ts ? new Date(ts*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—'; }
function fmtW(w) { return w != null ? `${Math.round(w)} W` : '—'; }
function tempColor(h) { return h==='Critical'?'var(--crit)':h==='Warning'?'var(--warn)':'var(--ok)'; }
function toggleEye(id) { const i=$(id); i.type=i.type==='password'?'text':'password'; }

function hbadge(s) {
  if (s.status==='offline') return ['hb-unk','离线'];
  if (s.status==='pending') return ['hb-pend','采集中'];
  return {OK:['hb-ok','正常'],Warning:['hb-warn','警告'],Critical:['hb-crit','严重']}[s.health] || ['hb-unk','未知'];
}
function sdot(h) { return {OK:'s-ok',Warning:'s-warn',Critical:'s-crit'}[h]||'s-unk'; }

function maxTemp(s) {
  const temps = s.temperatures || [];
  if (!temps.length) return null;
  return Math.max(...temps.map(t => t.reading_celsius));
}
function fanSummary(s) {
  const fans = s.fans||[];
  const bad = fans.filter(f=>f.health!=='OK').length;
  return fans.length===0 ? '—' : bad>0 ? `${bad}异常` : `${fans.length}正常`;
}
function psuSummary(s) {
  const psus = s.power_supplies||[];
  const bad = psus.filter(p=>p.health!=='OK').length;
  return psus.length===0 ? '—' : bad>0 ? `${bad}异常` : `${psus.length}正常`;
}
function fanClass(s) {
  const fans = s.fans||[];
  if (fans.some(f=>f.health==='Critical')) return 'mv-crit';
  if (fans.some(f=>f.health==='Warning'))  return 'mv-warn';
  return 'mv-ok';
}

// ── Auth ───────────────────────────────────────────
async function checkAuth() {
  const status = await fetch('/api/auth/status').then(r=>r.json()).catch(()=>null);
  if (!status) return;
  if (!status.initialized) { showAuthScreen('setup'); return; }
  $('auth-cluster-name').textContent = status.cluster_name;
  $('auth-cluster-name').style.display = 'block';
  if (token) {
    const res = await api('GET','/api/auth/me');
    if (res && res.ok) { currentUser = await res.json(); showApp(); return; }
  }
  showAuthScreen('login');
}

function showAuthScreen(step) {
  $('app').style.display = 'none';
  $('auth-screen').style.display = 'flex';
  document.querySelectorAll('.auth-step').forEach(s=>s.classList.remove('active'));
  $('step-'+step).classList.add('active');
  setTimeout(()=>$(step==='login'?'l-user':'s-cluster').focus(), 100);
}

function showApp() {
  $('auth-screen').style.display = 'none';
  $('app').style.display = 'block';
  $('hdr-username').textContent = currentUser.username;
  $('hdr-cluster').textContent = currentUser.cluster_name;
  $('hdr-role-tag').textContent = currentUser.role==='admin'?'管理员':'查看者';
  $('hdr-role-tag').className = 'role-tag '+(currentUser.role==='admin'?'role-admin':'role-viewer');
  document.querySelectorAll('.admin-only').forEach(el=>el.style.display=currentUser.role==='admin'?'':'none');
  initViewBtn();
  startPolling();
}

async function doSetup() {
  const cluster=$('s-cluster').value.trim(), username=$('s-user').value.trim();
  const password=$('s-pass').value, pass2=$('s-pass2').value;
  const err=$('setup-err'); err.textContent='';
  if(!cluster){err.textContent='请输入集群名称';return;}
  if(!username){err.textContent='请输入用户名';return;}
  if(password.length<6){err.textContent='密码至少 6 位';return;}
  if(password!==pass2){err.textContent='两次密码不一致';return;}
  const res=await fetch('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cluster_name:cluster,username,password})});
  const data=await res.json();
  if(!res.ok){err.textContent=data.detail||'初始化失败';return;}
  token=data.token; localStorage.setItem('sm_token',token);
  currentUser={username:data.username,role:data.role,cluster_access:null,cluster_name:data.cluster_name};
  showApp();
}

async function doLogin() {
  const username=$('l-user').value.trim(), password=$('l-pass').value;
  const err=$('login-err'), btn=$('login-btn'); err.textContent='';
  if(!username||!password){err.textContent='请输入用户名和密码';return;}
  btn.disabled=true; btn.textContent='登录中...';
  const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const data=await res.json();
  btn.disabled=false; btn.textContent='登录';
  if(!res.ok){err.textContent=data.detail||'登录失败';return;}
  token=data.token; localStorage.setItem('sm_token',token);
  currentUser={username:data.username,role:data.role,cluster_access:data.cluster_access,cluster_name:data.cluster_name};
  showApp();
}

async function doLogout() {
  if(token) await api('POST','/api/auth/logout');
  token=''; currentUser=null; servers=[]; subclusters=[];
  localStorage.removeItem('sm_token');
  if(_pollTimer) clearTimeout(_pollTimer);
  showAuthScreen('login');
}

document.addEventListener('keydown', e => {
  if(e.key==='Escape') ['ov-settings','ov-users','ov-subclusters','ov-detail'].forEach(closeOverlay);
  if(e.key==='Enter'){
    if($('step-login').classList.contains('active')) doLogin();
    if($('step-setup').classList.contains('active')) doSetup();
  }
});

// ── Filter & View ──────────────────────────────────
function setFilter(f, el) {
  filter=f; scFilter=null;
  document.querySelectorAll('.fl-btn').forEach(b=>b.classList.remove('act'));
  document.querySelectorAll('.fl-sc').forEach(b=>b.classList.remove('act'));
  el.classList.add('act');
  renderGrid();
}
function setScFilter(scId, el) {
  scFilter=scId; filter='all';
  document.querySelectorAll('.fl-btn,.fl-sc').forEach(b=>b.classList.remove('act'));
  el.classList.add('act');
  renderGrid();
}
function renderScFilterBtns() {
  $('sc-filter-btns').innerHTML = subclusters.map(sc=>
    `<button class="fl-sc${scFilter===sc.id?' act':''}" onclick="setScFilter('${sc.id}',this)">${esc(sc.name)}</button>`
  ).join('');
}
function matchFilter(s) {
  const q=$('search').value.toLowerCase();
  if(q&&!s.name.toLowerCase().includes(q)&&!s.bmc_ip.includes(q)) return false;
  if(scFilter!==null) return (s.subcluster_ids||[]).includes(scFilter);
  if(filter==='all') return true;
  if(filter==='offline') return s.status!=='online';
  if(filter==='ok') return s.status==='online'&&s.health==='OK';
  if(filter==='warning') return s.status==='online'&&s.health==='Warning';
  if(filter==='critical') return s.status==='online'&&s.health==='Critical';
  return true;
}

// ── Sort (for table) ───────────────────────────────
function sortedServers(arr) {
  return [...arr].sort((a,b) => {
    let av = getSortVal(a, sortCol), bv = getSortVal(b, sortCol);
    if (typeof av === 'string' && typeof bv === 'string') return av.localeCompare(bv)*sortDir;
    av = av ?? -Infinity; bv = bv ?? -Infinity;
    return (av-bv)*sortDir;
  });
}
function getSortVal(s, col) {
  switch(col) {
    case 'bmc_ip':  return s.bmc_ip;
    case 'name':    return s.name;
    case 'status':  return s.status;
    case 'health':  return s.health;
    case 'proto':   return s.protocol_used||'';
    case 'mfr':     return s.manufacturer||'';
    case 'model':   return s.model||'';
    case 'memory':  return (s.memory_summary||{}).total_gib;
    case 'cpu':     return (s.processors||[])[0]?.model||'';
    case 'cores':   return (s.processors||[])[0]?.cores;
    case 'power':   return s.power_consumed_watts;
    case 'temp':    return maxTemp(s);
    default:        return null;
  }
}
function clickSort(col) {
  if(sortCol===col) sortDir*=-1; else { sortCol=col; sortDir=1; }
  renderGrid();
}
function sortArrow(col) {
  if(sortCol!==col) return '<span class="sort-arrow">↕</span>';
  return sortDir===1?'<span class="sort-arrow">↑</span>':'<span class="sort-arrow">↓</span>';
}

// ── Main render dispatcher ─────────────────────────
function renderGrid() {
  const vis = servers.filter(matchFilter);
  const el = $('main');

  if (!vis.length) {
    el.innerHTML = '<div class="empty"><div style="color:var(--tx3)">没有符合条件的服务器</div></div>';
    return;
  }

  // Viewer: group by subcluster in grid/wide modes only
  const isViewerGrouped = currentUser?.role==='viewer' && !scFilter && filter==='all'
    && (viewMode==='grid'||viewMode==='grid-wide');

  const sorted = viewMode==='table' ? sortedServers(vis) : vis;

  switch(viewMode) {
    case 'grid':
    case 'grid-wide': {
      const cls = viewMode==='grid-wide' ? 'grid-wide' : 'grid';
      if (isViewerGrouped) {
        let html='';
        for (const sc of subclusters) {
          const items = sorted.filter(s=>(s.subcluster_ids||[]).includes(sc.id));
          if (!items.length) continue;
          html+=`<div class="sc-group"><div class="sc-group-title">${esc(sc.name)}${sc.description?` <span style="font-size:.63rem;color:var(--tx3);font-weight:400">${esc(sc.description)}</span>`:''}</div><div class="${cls}">${items.map(s=>renderCardHtml(s,viewMode==='grid-wide')).join('')}</div></div>`;
        }
        const ungrouped=sorted.filter(s=>!(s.subcluster_ids||[]).length);
        if (ungrouped.length) html+=`<div class="sc-group"><div class="sc-group-title">未分组</div><div class="${cls}">${ungrouped.map(s=>renderCardHtml(s)).join('')}</div></div>`;
        el.innerHTML = html;
      } else {
        el.innerHTML = `<div class="${cls}">${sorted.map(s=>renderCardHtml(s,viewMode==='grid-wide')).join('')}</div>`;
      }
      break;
    }
    case 'list-detail':
      el.innerHTML = `<div class="detail-list">${sorted.map(renderDetailListHtml).join('')}</div>`;
      break;
    case 'list-simple':
      el.innerHTML = `<div class="simple-list">${sorted.map(renderSimpleListHtml).join('')}</div>`;
      break;
    case 'table': {
      const thead = TABLE_COLS.map(c=>{
        const active = sortCol===c.key?' sorted':'';
        const click = c.sortable?`onclick="clickSort('${c.key}')" style="cursor:pointer"`:'';
        return `<th class="${active}" ${click}>${c.label}${c.sortable?sortArrow(c.key):''}</th>`;
      }).join('');
      el.innerHTML = `<div class="tbl-wrap"><table><thead><tr>${thead}</tr></thead><tbody>${sorted.map(renderTableRow).join('')}</tbody></table></div>`;
      break;
    }
  }
}

// ── Polling ────────────────────────────────────────
function startPolling() { if(_pollTimer)clearTimeout(_pollTimer); _pollTimer=setTimeout(poll,200); }
async function poll() {
  if(!token) return;
  try {
    const res=await api('GET','/api/servers');
    if(!res) return;
    const data=await res.json();
    updateUI(data);
    _pollTimer=setTimeout(poll,data.collecting?1800:(data.refresh_interval||60)*1000);
  } catch(e) { _pollTimer=setTimeout(poll,5000); }
}

async function triggerRefresh() {
  const btn=$('btn-refresh'); btn.disabled=true;
  await api('POST','/api/refresh').catch(()=>{});
  startPolling();
  setTimeout(()=>{btn.disabled=false;},3000);
}

// ── Settings Modal ─────────────────────────────────
async function openSettingsModal() {
  const res=await api('GET','/api/settings'); if(!res) return;
  const s=await res.json();
  $('cfg-ip').value=s.ip_ranges||''; $('cfg-user').value=s.username||'admin';
  $('cfg-pw').value=s.password||''; $('cfg-ri').value=s.refresh_interval||60;
  $('cfg-to').value=s.collection_timeout||15; $('cfg-cc').value=s.max_concurrent||10;
  cfgProto=s.protocol||'auto';
  document.querySelectorAll('.proto-opt').forEach(b=>b.classList.toggle('sel',b.dataset.v===cfgProto));
  updateIpCount();
  $('ov-settings').classList.add('open'); document.body.style.overflow='hidden';
}
function selProto(el){document.querySelectorAll('.proto-opt').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');cfgProto=el.dataset.v;const h={auto:'自动检测：优先 Redfish，失败后回退 IPMI',redfish:'仅使用 Redfish REST API',ipmi:'仅使用 IPMI（需要 ipmitool）'};$('proto-hint').textContent=h[cfgProto]||'';}
function countIps(t){let n=0;for(const e of t.split(/[\n,;]+/)){const s=e.trim();if(!s||s.startsWith('#'))continue;try{if(s.includes('/')){const b=parseInt(s.split('/')[1]);n+=Math.pow(2,32-b)-2;}else if(s.includes('-')){const[l,r]=s.split('-',2);const ip=o=>o.split('.').reduce((a,x)=>(a<<8)+parseInt(x),0)>>>0;const ei=(r.includes('.')?r:l.split('.').slice(0,3).join('.')+'.'+r);n+=Math.max(0,ip(ei)-ip(l)+1);}else n+=1;}catch(e){}}return n;}
function updateIpCount(){const n=countIps($('cfg-ip').value);const b=$('ip-count-badge');if(n>0){b.style.display='inline-flex';$('ip-count-text').textContent=`共 ${n} 个地址`;}else b.style.display='none';}
function toggleAdv(){$('adv-toggle').classList.toggle('open');$('adv-body').classList.toggle('open');}
async function saveSettings(){const btn=$('btn-save-cfg');btn.disabled=true;btn.textContent='保存中...';try{await api('POST','/api/settings',{ip_ranges:$('cfg-ip').value,username:$('cfg-user').value,password:$('cfg-pw').value,protocol:cfgProto,refresh_interval:parseInt($('cfg-ri').value)||60,collection_timeout:parseInt($('cfg-to').value)||15,max_concurrent:parseInt($('cfg-cc').value)||10});closeOverlay('ov-settings');startPolling();}finally{btn.disabled=false;btn.textContent='保存并扫描';}}

// ── User Modal ─────────────────────────────────────
async function openUsersModal(){$('user-err').textContent='';$('nu-name').value='';$('nu-pass').value='';$('nu-role').value='viewer';onRoleChange();await refreshUserList();await refreshAccessList();$('ov-users').classList.add('open');document.body.style.overflow='hidden';}
function getScNames(ids){return(ids||[]).map(id=>{const sc=subclusters.find(s=>s.id===id);return sc?sc.name:id;});}
async function refreshUserList(){const res=await api('GET','/api/users');if(!res)return;const users=await res.json();$('user-list').innerHTML=users.map(u=>`<div class="user-item"><div class="user-info"><div class="user-name">${esc(u.username)} <span class="role-tag ${u.role==='admin'?'role-admin':'role-viewer'}">${u.role==='admin'?'管理员':'查看者'}</span></div><div class="user-meta">${u.role==='viewer'&&u.cluster_access?'可访问：'+getScNames(u.cluster_access).join('、'):'所有权限'}</div></div><div style="display:flex;gap:5px"><button class="btn-sm" onclick="editUserModal('${u.id}','${esc(u.username)}','${u.role}',${JSON.stringify(u.cluster_access||null)})">编辑</button>${u.username!==currentUser.username?`<button class="btn-sm btn-sm-del" onclick="deleteUser('${u.id}','${esc(u.username)}')">删除</button>`:''}</div></div>`).join('')||'<div style="color:var(--tx3);font-size:.75rem">暂无用户</div>';}
async function refreshAccessList(){$('nu-access-list').innerHTML=subclusters.length===0?'<div style="color:var(--tx3);font-size:.73rem;padding:3px">暂无子集群</div>':subclusters.map(sc=>`<label class="access-item"><input type="checkbox" class="nu-sc-cb" value="${sc.id}"> ${esc(sc.name)}</label>`).join('');}
function onRoleChange(){$('nu-access-wrap').style.display=$('nu-role').value==='viewer'?'':'';}
async function addUser(){const name=$('nu-name').value.trim(),pass=$('nu-pass').value,role=$('nu-role').value,err=$('user-err');err.textContent='';if(!name||!pass){err.textContent='请填写用户名和密码';return;}if(pass.length<6){err.textContent='密码至少 6 位';return;}const cluster_access=role==='viewer'?[...document.querySelectorAll('.nu-sc-cb:checked')].map(cb=>cb.value):null;const res=await api('POST','/api/users',{username:name,password:pass,role,cluster_access});if(!res)return;const data=await res.json();if(!res.ok){err.textContent=data.detail||'添加失败';return;}$('nu-name').value='';$('nu-pass').value='';await refreshUserList();}
async function editUserModal(id,username,role,cluster_access){const newPass=prompt(`编辑用户 "${username}"\n新密码（留空不修改）：`);const newRole=prompt(`角色 (admin/viewer)，当前：${role}`)||role;let newAccess=cluster_access;if(newRole==='viewer'){const ids=(cluster_access||[]).join(',');const input=prompt(`可访问子集群 ID（逗号分隔），当前：${ids}\n可用：\n${subclusters.map(s=>s.name+': '+s.id).join('\n')}`)||ids;newAccess=input.split(',').map(s=>s.trim()).filter(Boolean);}else newAccess=null;const body={role:newRole,cluster_access:newAccess};if(newPass&&newPass.trim())body.password=newPass.trim();const res=await api('PUT',`/api/users/${id}`,body);if(!res)return;if(!res.ok){const d=await res.json();alert(d.detail||'更新失败');return;}await refreshUserList();}
async function deleteUser(id,username){if(!confirm(`确认删除用户 "${username}"？`))return;const res=await api('DELETE',`/api/users/${id}`);if(!res)return;if(!res.ok){const d=await res.json();alert(d.detail||'删除失败');return;}await refreshUserList();}

// ── Subcluster Modal ───────────────────────────────
async function openSubclustersModal(){_editScId=null;$('sc-name').value='';$('sc-desc').value='';$('sc-err').textContent='';$('sc-form-title').textContent='新建子集群';$('btn-sc-save').textContent='创建';await renderScList();renderIpSelect([]);$('ov-subclusters').classList.add('open');document.body.style.overflow='hidden';}
async function renderScList(){const res=await api('GET','/api/subclusters');if(!res)return;const scs=await res.json();subclusters=scs;renderScFilterBtns();$('sc-list').innerHTML=scs.length===0?'<div style="color:var(--tx3);font-size:.75rem">暂无子集群</div>':scs.map(sc=>`<div class="sc-item"><div class="sc-info"><div class="sc-name">${esc(sc.name)}</div>${sc.description?`<div class="sc-desc">${esc(sc.description)}</div>`:''}<div class="sc-ips">${sc.bmc_ips&&sc.bmc_ips.length?sc.bmc_ips.length+'台: '+sc.bmc_ips.slice(0,3).join(', ')+(sc.bmc_ips.length>3?'...':''):'暂无机器'}</div></div><div style="display:flex;gap:5px;flex-shrink:0"><button class="btn-sm" onclick="editSc('${sc.id}')">编辑</button><button class="btn-sm btn-sm-del" onclick="deleteSc('${sc.id}','${esc(sc.name)}')">删除</button></div></div>`).join('');}
function renderIpSelect(sel){const w=$('sc-ip-select');if(!servers.length){w.innerHTML='<div style="padding:9px;color:var(--tx3);font-size:.72rem">请先配置 IP 范围并等待扫描</div>';return;}w.innerHTML=servers.map(s=>{const id='ip-'+s.bmc_ip.replace(/\./g,'-');return`<div class="ip-select-item"><input type="checkbox" id="${id}" value="${s.bmc_ip}"${sel.includes(s.bmc_ip)?' checked':''}><label for="${id}">${s.bmc_ip}${s.name!==s.bmc_ip?' <span style="color:var(--tx3)">'+esc(s.name)+'</span>':''}</label><span style="font-size:.65rem;color:${s.status==='online'?'var(--ok)':'var(--crit)'}">${s.status==='online'?'●':'○'}</span></div>`;}).join('');}
function getSelectedIps(){return[...document.querySelectorAll('#sc-ip-select input:checked')].map(cb=>cb.value);}
async function editSc(id){const sc=subclusters.find(s=>s.id===id);if(!sc)return;_editScId=id;$('sc-form-title').textContent='编辑子集群';$('sc-name').value=sc.name;$('sc-desc').value=sc.description||'';$('btn-sc-save').textContent='保存修改';$('sc-err').textContent='';renderIpSelect(sc.bmc_ips||[]);}
function cancelScEdit(){_editScId=null;$('sc-form-title').textContent='新建子集群';$('sc-name').value='';$('sc-desc').value='';$('btn-sc-save').textContent='创建';$('sc-err').textContent='';renderIpSelect([]);}
async function saveSubcluster(){const name=$('sc-name').value.trim(),desc=$('sc-desc').value.trim(),ips=getSelectedIps(),err=$('sc-err');err.textContent='';if(!name){err.textContent='请输入名称';return;}const res=_editScId?await api('PUT',`/api/subclusters/${_editScId}`,{name,description:desc,bmc_ips:ips}):await api('POST','/api/subclusters',{name,description:desc,bmc_ips:ips});if(!res)return;if(!res.ok){const d=await res.json();err.textContent=d.detail||'保存失败';return;}cancelScEdit();await renderScList();renderGrid();}
async function deleteSc(id,name){if(!confirm(`确认删除子集群 "${name}"？`))return;const res=await api('DELETE',`/api/subclusters/${id}`);if(!res)return;await renderScList();renderGrid();}

// ── Detail Modal ───────────────────────────────────
function openDetail(key){const ip=key.replace(/-/g,'.');const s=servers.find(x=>x.bmc_ip===ip);if(!s)return;const[hcls,hlbl]=hbadge(s);$('det-title').textContent=s.name;$('det-sub').textContent=`BMC: ${s.bmc_ip}  ·  序列号: ${s.serial||'—'}  ·  协议: ${s.protocol_used||'—'}  ·  更新: ${fmtTime(s.last_updated)}`;$('det-badge').innerHTML=`<span class="hbadge ${hcls}">${hlbl}</span>`;$('det-body').innerHTML=buildDetail(s);$('ov-detail').classList.add('open');document.body.style.overflow='hidden';}
function buildDetail(s){const sec=(t,b)=>`<div style="margin-bottom:18px"><div class="sec-title">${t}</div>${b}</div>`;const ms=s.memory_summary||{};const parts=[];parts.push(sec('系统信息',`<div class="info-grid"><div><div class="ik">主机名</div><div class="iv">${s.hostname||'—'}</div></div><div><div class="ik">制造商</div><div class="iv">${s.manufacturer||'—'}</div></div><div><div class="ik">型号</div><div class="iv">${s.model||'—'}</div></div><div><div class="ik">序列号</div><div class="iv">${s.serial||'—'}</div></div><div><div class="ik">BIOS / 固件</div><div class="iv">${s.bios_version||'—'}</div></div><div><div class="ik">电源状态</div><div class="iv">${s.power_state||'—'}</div></div>${ms.total_gib?`<div><div class="ik">总内存</div><div class="iv">${ms.total_gib} GiB</div></div>`:''}<div><div class="ik">当前功耗</div><div class="iv">${fmtW(s.power_consumed_watts)}</div></div></div>`));if((s.processors||[]).length){const rows=s.processors.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.model||'—')}</td><td>${p.cores??'—'}</td><td>${p.speed_ghz!=null?p.speed_ghz+' GHz':'—'}</td><td><span class="sdot ${sdot(p.health)}"></span>${p.health||'—'}</td></tr>`).join('');parts.push(sec('处理器',`<table><thead><tr><th>名称</th><th>型号</th><th>核心</th><th>频率</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`));}if((s.temperatures||[]).length){const rows=s.temperatures.map(t=>`<tr><td>${esc(t.name)}</td><td style="font-weight:600;color:${tempColor(t.health)}">${t.reading_celsius} °C</td><td>${t.upper_caution!=null?t.upper_caution+' °C':'—'}</td><td>${t.upper_critical!=null?t.upper_critical+' °C':'—'}</td><td><span class="sdot ${sdot(t.health)}"></span>${t.health||'OK'}</td></tr>`).join('');parts.push(sec('温度传感器',`<table><thead><tr><th>传感器</th><th>当前值</th><th>警告阈值</th><th>严重阈值</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`));}if((s.fans||[]).length){const rows=s.fans.map(f=>`<tr><td>${esc(f.name)}</td><td>${f.reading!=null?f.reading+' '+(f.reading_units||'RPM'):'—'}</td><td><span class="sdot ${sdot(f.health)}"></span>${f.health||'—'}</td></tr>`).join('');parts.push(sec('风扇',`<table><thead><tr><th>名称</th><th>转速</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`));}if((s.power_supplies||[]).length){const rows=s.power_supplies.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.model||'—')}</td><td>${p.line_input_voltage!=null?p.line_input_voltage+' V':'—'}</td><td>${p.power_output_watts!=null?p.power_output_watts+' W':'—'}</td><td><span class="sdot ${sdot(p.health)}"></span>${p.health||'—'}</td></tr>`).join('');parts.push(sec('电源模块',`<table><thead><tr><th>名称</th><th>型号</th><th>输入电压</th><th>输出功率</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`));}if((s.storage||[]).length){const rows=s.storage.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.drives_count??'—'} 个</td><td><span class="sdot ${sdot(c.health)}"></span>${c.health||'—'}</td></tr>`).join('');parts.push(sec('存储控制器',`<table><thead><tr><th>控制器</th><th>驱动器数</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`));}if((s.alerts||[]).length)parts.push(sec('告警',`<div style="color:var(--warn);font-size:.82rem">${s.alerts.map(esc).join('<br>')}</div>`));if(s.error)parts.push(sec('错误',`<div style="color:var(--crit);font-size:.78rem">${esc(s.error)}</div>`));return parts.join('');}

// ── Overlays ───────────────────────────────────────
function openOverlay(id){if(id==='ov-settings')openSettingsModal();else if(id==='ov-users')openUsersModal();else if(id==='ov-subclusters')openSubclustersModal();else{$(id).classList.add('open');document.body.style.overflow='hidden';}}
function closeOverlay(id){$(id).classList.remove('open');document.body.style.overflow='';}
function closeOvBg(e,id){if(e.target===$(id))closeOverlay(id);}

// ── Init ───────────────────────────────────────────
applyTheme(localStorage.getItem('sm_theme')||'dark');
checkAuth();
</script>
